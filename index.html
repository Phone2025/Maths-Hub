<html lang="en-GB">
<head>

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">
<style>html{-webkit-text-size-adjust:100%}button,a,[role=button],summary,label{touch-action:manipulation}input,select,textarea{font-size:max(16px,1em)}#drawerBtn,.drawer-btn{bottom:calc(16px + env(safe-area-inset-bottom))!important}</style>
<title>Year 3 Maths Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a calm learning hub. Sticky top bar, generous white space, one column of content up to 1100px; units and lessons as a grid of quiet cards; each lesson is a numbered 1-2-3 path (words, play, check). The games keep their own dark console look and open in an overlay. */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --sunk:#eef2f8; --line:#dde4ef;
  --ink:#14213d; --soft:#4f5d75; --faint:#7b879c;
  --accent:#2f6fdf; --accent-ink:#ffffff; --accent-tint:#e7efff;
  --gold:#e8a800; --gold-tint:#fff4d6; --ok:#1f9d63; --ok-tint:#e3f6ec; --warn:#d2570f; --warn-tint:#fdebe0;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 8px 24px rgba(20,33,61,.06);
  --font:'Lexend','Segoe UI',Verdana,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1626; --surface:#162036; --sunk:#111a2c; --line:#26334d;
  --ink:#e8eef8; --soft:#a9b6cc; --faint:#7e8ba3;
  --accent:#6ea0ff; --accent-ink:#0b1424; --accent-tint:#1c2c4d;
  --gold:#f5c451; --gold-tint:#3a3018; --ok:#3dd68c; --ok-tint:#173628; --warn:#ff8a3d; --warn-tint:#3a2316;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1626; --surface:#162036; --sunk:#111a2c; --line:#26334d;
  --ink:#e8eef8; --soft:#a9b6cc; --faint:#7e8ba3;
  --accent:#6ea0ff; --accent-ink:#0b1424; --accent-tint:#1c2c4d;
  --gold:#f5c451; --gold-tint:#3a3018; --ok:#3dd68c; --ok-tint:#173628; --warn:#ff8a3d; --warn-tint:#3a2316;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1100px;margin:0 auto}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .inner{display:flex;align-items:center;gap:8px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--ink);text-decoration:none;margin-right:auto}
.brand svg{width:34px;height:34px}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--soft);text-decoration:none;font-weight:500;font-size:15px;padding:8px 12px;border-radius:10px}
nav a:hover{background:var(--sunk);color:var(--ink)}
nav a.on{background:var(--accent-tint);color:var(--accent)}
main{padding-block:32px 72px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(30px,5vw,46px);font-weight:700;letter-spacing:-.01em}
h2{font-size:24px;font-weight:700}
h3{font-size:18px;font-weight:600}
p{margin:0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.lead{font-size:19px;color:var(--soft);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:18px;margin-top:44px}
.sechead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 16px var(--font);border-radius:12px;padding:12px 18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer;min-height:48px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{font-size:14px;padding:8px 12px;min-height:38px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:center}
.hero .art{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.hero .art svg{display:block;width:100%;height:auto;max-width:100%}
.hero .art .heroimg{display:block;width:100%;height:100%;min-height:240px;max-height:380px;object-fit:cover;object-position:50% 60%;border-radius:16px}
body.low .hero .art .heroimg{filter:saturate(.6)}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
/* units */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.unit{padding:20px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;min-height:160px}
.unit .tag{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--faint)}
.unit.live{border-color:var(--accent)}
.unit.live .tag{background:var(--ok-tint);color:var(--ok)}
.unit.soon{opacity:.6;box-shadow:none}
.unit p{color:var(--soft);font-size:15px}
a.unit.live:hover{transform:translateY(-2px);transition:transform .15s}
/* lessons */
.lesson{padding:18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;position:relative}
.lesson .num{display:flex;align-items:center;justify-content:space-between}
.lesson .num b{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.lesson p{font-size:15px;color:var(--soft)}
.done{font-size:12px;font-weight:600;color:var(--ok);background:var(--ok-tint);padding:2px 9px;border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipw{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--soft)}
a.lesson:hover{border-color:var(--accent)}
/* lesson page */
.crumb{font-size:14px;color:var(--faint)}
.crumb a{color:var(--soft)}
.steps{display:flex;flex-direction:column;gap:20px;margin-top:32px}
.step{padding:22px;display:flex;flex-direction:column;gap:16px}
.step .sh{display:flex;align-items:center;gap:14px}
.step .n{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:18px}
.step .sh p{color:var(--soft);font-size:15px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
/* vocab cards */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.vcard .pic{background:#e9f0fb;border-radius:12px;display:flex;align-items:center;justify-content:center;height:112px}
.vcard .pic svg{width:140px;height:104px}
.vcard .w{font-size:22px;font-weight:700;line-height:1.15}
.vcard .m{font-size:15px;color:var(--soft)}
.vcard .les{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.vcard .row{display:flex;gap:8px;margin-top:auto}
.vcard .row button{flex:1}
.vcard .yt{display:none;text-align:center;font-weight:600;color:var(--ok);font-size:15px}
.vcard.your .yt{display:block}
.hide .vcard .m{filter:blur(6px);cursor:pointer}
.hide .vcard .m.shown{filter:none}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font:500 14px var(--font);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer}
.filters button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
/* games */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.game{padding:18px;display:flex;flex-direction:column;gap:10px}
.game .ico{width:48px;height:48px;border-radius:14px;background:#141f33;display:flex;align-items:center;justify-content:center}
.game .ico svg{width:30px;height:30px}
.game p{font-size:15px;color:var(--soft)}
.game .btn{margin-top:auto;align-self:flex-start}
.empty{padding:18px;border:1px dashed var(--line);border-radius:16px;color:var(--soft);font-size:15px}
/* quiz */
.q{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;background:var(--sunk)}
.q .qt{font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opts button{font:500 16px var(--font);text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:48px}
.opts button.right{border-color:var(--ok);background:var(--ok-tint)}
.opts button.wrong{border-color:var(--warn);background:var(--warn-tint)}
.fb{font-size:15px;font-weight:500}
.fb.good{color:var(--ok)} .fb.bad{color:var(--warn)}
.qres{display:flex;flex-direction:column;gap:12px;margin-top:8px}.score.big{font-size:20px;display:flex;flex-direction:column;gap:4px}.score.big span{font-weight:500;font-size:17px;color:var(--soft)}.qrh{font-size:22px;margin:10px 0 0}.fmore summary{cursor:pointer;font-weight:700;color:var(--accent);padding:10px 0;min-height:44px}.fmore .flist{margin-top:6px}
.flist{display:flex;flex-direction:column;gap:10px}.focus{border:1px solid var(--line);border-left:6px solid var(--warn);border-radius:14px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:8px}.focus p{color:var(--soft)}
.fhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}.fhead b{font-size:18px}.fl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}.fm{margin-left:auto;font-size:14px;font-weight:600;color:var(--warn);background:var(--warn-tint);padding:4px 10px;border-radius:999px}
.secure{display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;background:var(--ok-tint,#e3f6ec);color:var(--ink);font-weight:600;font-size:15px;border:1px solid var(--line)}
.score{font-weight:600;padding:12px 16px;border-radius:12px;background:var(--gold-tint)}
.top{margin-top:14px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.glyph{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;color:#fff;font-weight:700;flex:none;line-height:1;vertical-align:middle}
h2 .glyph{border-radius:8px;margin-right:6px}
.unit .go{margin-top:auto;color:var(--accent);font-weight:600;font-size:15px}
.unit.soon .tag{margin-top:auto}
.unithead{display:flex;gap:18px;align-items:center}
.unithead .glyph{border-radius:18px}
h1.lo{font-size:clamp(26px,4vw,38px)}
.seg{display:flex;flex-wrap:wrap;gap:6px;padding:4px;background:var(--sunk);border-radius:14px;align-self:flex-start}
.seg a{font-size:14px;font-weight:500;color:var(--soft);text-decoration:none;padding:8px 12px;border-radius:10px}
.seg a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg a.off{opacity:.55}
/* overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,12,22,.75);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.overlay .top{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px}
.overlay iframe{flex:1;width:100%;border:0;background:#0d1524}
.slides{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){ a.unit.live:hover{transform:none} }
/* pictures, read buttons, tools, settings */
.q.has-pic{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:16px;align-items:start}
.q .qmain{display:flex;flex-direction:column;gap:10px;min-width:0}
.qpic{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:center}
.qpic svg{width:100%;height:auto;max-height:180px}
.qpic img{width:100%;height:auto;max-height:200px;object-fit:cover;border-radius:8px}
@media (max-width:640px){.q.has-pic{grid-template-columns:1fr}.qpic svg{max-height:150px}}
.qfrom{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.qhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.rd{flex:none;font:600 13px var(--font);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:36px}
.rd svg{width:16px;height:16px}
.rd.on{background:var(--gold-tint);border-color:var(--gold)}
.lohead{display:flex;gap:12px;align-items:flex-start}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tool{padding:18px;display:flex;flex-direction:column;gap:10px}
.tool .ico{width:56px;height:56px;border-radius:14px;background:var(--sunk);display:flex;align-items:center;justify-content:center}
.tool .ico svg{width:40px;height:40px}
.tool p{font-size:15px;color:var(--soft)}
.tool .btn{margin-top:auto;align-self:flex-start}
#setBtn{font:500 15px var(--font);color:var(--soft);background:none;border:0;padding:8px 12px;border-radius:10px;cursor:pointer}
#setBtn:hover,#setBtn[aria-expanded="true"]{background:var(--sunk);color:var(--ink)}
.setp{position:fixed;z-index:60;top:64px;right:max(12px,env(safe-area-inset-right,0px));width:min(340px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 16px 40px rgba(15,22,38,.18);display:flex;flex-direction:column;gap:8px}
.setp h2{font-size:18px;margin:0 0 4px}
.setp label{display:flex;gap:12px;align-items:center;min-height:44px;cursor:pointer;font-size:16px}
.setp label small{display:block;color:var(--soft);font-size:13px}
.setp input{width:22px;height:22px;accent-color:var(--accent);flex:none}
body.big main{zoom:1.15}
body.still *,body.still *::before,body.still *::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
body.still a.unit.live:hover{transform:none}
.warmban{display:flex;gap:16px;align-items:center;margin-top:24px;padding:18px 20px;border-radius:16px;background:var(--surface);border:1px solid var(--line);border-left:6px solid #e0485f;color:var(--ink);text-decoration:none}.warmban:hover{border-color:#e0485f}.warmban .wi{font-size:34px;line-height:1;flex:none}.warmban .wt{flex:1;display:flex;flex-direction:column;gap:2px}.warmban b{font-size:19px;color:var(--ink)}.warmban span{color:var(--soft);font-size:16px}.warmban i{font-style:normal;font-weight:700;flex:none;background:var(--accent);color:var(--accent-ink);padding:12px 20px;border-radius:12px;min-height:24px}@media (max-width:560px){.warmban{flex-wrap:wrap}.warmban i{width:100%;text-align:center}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.pz{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);border-top:6px solid;color:var(--ink);text-decoration:none}.pz p{color:var(--soft);font-size:15px}
#drawerBtn{position:fixed;z-index:80;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;font:600 15px var(--font);padding:10px 16px 10px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 8px 24px rgba(15,22,38,.18);cursor:pointer;min-height:48px}
#drawerBtn svg{width:24px;height:24px}
#drawer{position:fixed;z-index:79;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(15,22,38,.16);display:flex;flex-direction:column}
#drawer[hidden]{display:none}
#drawer .dhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
#drawer .dhead .soft{color:var(--soft);font-size:13px;flex:1}
#drawer iframe{flex:1;border:0;width:100%;background:var(--bg)}
body.drawer-open #drawerBtn{right:min(574px,calc(100vw - 150px))}
@media (max-width:640px){body.drawer-open #drawerBtn{display:none}#drawerBtn span{display:none}#drawerBtn{padding:12px}}
.vrow{display:flex;flex-direction:column;gap:6px;padding:6px 0}.vrow small{color:var(--soft);font-size:12px}.vsel{display:flex;gap:8px}.vsel select{flex:1;min-width:0;font:500 14px var(--font);padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
body.low{--bg:#fbf6e9;--surface:#fffdf7;--sunk:#f3eddc;--line:#d8cfb8;--ink:#000;--soft:#222;background:#fbf6e9!important;color:#000}
body.low *{box-shadow:none!important;background-image:none!important;text-shadow:none!important}
body.low .art,body.low .glyph,body.low .gicon,body.low .unit .ico{filter:grayscale(1);opacity:.75}
body.low header,body.low .card,body.low .q,body.low a.unit{background:#fffdf7!important}
</style>

<script id="mh-voice">/* Maths Hub voice: picks the most natural English voice on this device and applies the reader's settings */
(function(){var ss=window.speechSynthesis;if(!ss||ss.__mh)return;ss.__mh=1;var orig=ss.speak.bind(ss);
function A(){try{return JSON.parse(localStorage.getItem('mh-a11y')||'{}')||{};}catch(e){return {};}}
var BAD=/compact|espeak|robot|novelty|bad news|bells|whisper|zarvox|trinoids|albert|jester|organ|cellos|bubbles|boing|deranged|hysterical|superstar|wobble|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley|good news|junior|ralph|fred|kathy|vicki|victoria/;
function rank(v){var n=v.name.toLowerCase(),l=(v.lang||'').toLowerCase().replace('_','-'),s=0;if(l.indexOf('en')!==0)return -1;
  if(l==='en-gb')s+=30;else if(l==='en-ie'||l==='en-au'||l==='en-nz')s+=16;else s+=10;
  if(/natural|neural/.test(n))s+=45;if(/online/.test(n))s+=8;if(/premium/.test(n))s+=42;if(/enhanced/.test(n))s+=36;if(/siri/.test(n))s+=30;
  if(/google uk english female/.test(n))s+=26;else if(/google uk english/.test(n))s+=22;else if(/google/.test(n))s+=12;
  if(/sonia|libby|maisie|abbi|bella|hollie|olivia|serena|kate|stephanie|martha|daniel|arthur|oliver|jamie/.test(n))s+=12;
  if(BAD.test(n))s-=80;return s;}
function list(){return ss.getVoices().filter(function(v){return rank(v)>=0;}).sort(function(a,b){return rank(b)-rank(a);});}
function best(){var a=A(),vs=ss.getVoices();if(a.voice){var f=vs.filter(function(v){return v.name===a.voice;})[0];if(f)return f;}return list()[0]||null;}
ss.speak=function(u){try{var v=best();if(v){u.voice=v;u.lang=v.lang;}var a=A();u.rate=a.slow?0.8:0.97;u.pitch=1;
  if(u.text)u.text=u.text.replace(/\s*\n+\s*/g,'. ').replace(/\s{2,}/g,' ');}catch(e){}return orig(u);};
window.MH_VOICES=list;window.MH_VOICE_RANK=rank;
try{ss.getVoices();if(typeof ss.addEventListener==='function')ss.addEventListener('voiceschanged',function(){});}catch(e){}
})();
</script>

  document.getElementById('newq').onclick=function(){view.innerHTML=unitQuiz(u);unitQuizWire(u);window.scrollTo(0,0);};}
var lfilt='all', hideM=false;
function withWords(){return UNITS.filter(function(u){return u.words.length;});}
function words(uid){
  var u=U(uid)||withWords()[0];
  var utabs=UNITS.map(function(x){return x.words.length?'<a href="#words-'+x.id+'" class="'+(x===u?'on':'')+'">'+esc(x.name)+'</a>':'';}).join('');
  var tabs='<button data-f="all" class="'+(lfilt==='all'?'on':'')+'" type="button">All lessons</button>'+u.lessons.filter(function(L){return u.words.some(function(w){return inL(w,L.n);});}).map(function(L){return '<button data-f="'+L.n+'" class="'+(lfilt===String(L.n)?'on':'')+'" type="button">'+L.n+' · '+esc(L.short)+'</button>';}).join('');
  return '<div class="crumb"><a href="#home">Home</a> / Words</div><section class="stack top"><span class="eyebrow">Vocabulary</span><h1>Key words</h1><p class="lead">The key words for every unit. Press My turn to hear a word, then Your turn to say it. Hide the meanings to test yourself.</p></section>'+
   '<section class="section"><div class="seg">'+utabs+'</div><div class="sechead"><div class="filters" id="fl">'+tabs+'</div><button class="btn small" id="hm" type="button">'+(hideM?'Show meanings':'Hide meanings')+'</button></div><div class="vgrid'+(hideM?' hide':'')+'" id="wg"></div></section>';
}
function wordsWire(uid){
  var u=U(uid)||withWords()[0], list=u.words.filter(function(w){return lfilt==='all'||inL(w,lfilt);}), g=document.getElementById('wg');
  g.innerHTML=vcards(list); wireCards(g,list);
  document.querySelectorAll('#fl button').forEach(function(b){b.onclick=function(){lfilt=b.dataset.f;route();};});
  document.getElementById('hm').onclick=function(){hideM=!hideM;route();};
}
function games(uid){
  var list=uid?[U(uid)]:UNITS.filter(function(u){return u.gameGroups.length;});
  return '<div class="crumb"><a href="#home">Home</a> / Games</div><section class="stack top"><span class="eyebrow">Games</span><h1>Learn and play</h1><p class="lead">Every game opens with a short lesson that reminds you of the idea. Then you play. Skip the lesson if you already know it.</p></section>'+
   (uid?'':'<div class="seg" style="margin-top:24px">'+UNITS.map(function(u){return '<a href="'+(u.gameGroups.length?'#games-'+u.id:'#games')+'" class="'+(u.gameGroups.length?'':'off')+'">'+esc(u.name)+(u.gameGroups.length?'':' · soon')+'</a>';}).join('')+'</div>')+
   list.map(function(u){return u.gameGroups.map(function(g){return '<section class="section"><div class="sechead"><h2>'+glyph(u,28)+' '+esc(g[0])+'</h2><span class="crumb">'+esc(u.name)+' · '+esc(g[1])+'</span></div><div class="ggrid">'+g[2].map(gameCard).join('')+'</div></section>';}).join('');}).join('')+
   (uid?'<div class="pager"><a class="btn" href="#games">All games</a><a class="btn primary" href="#'+uid+'">'+esc(U(uid).name)+' lessons</a></div>':'');
}
function route(){
  var h=(location.hash||'#home').slice(1), m, tab='home', u;
  if((m=h.match(/^([a-z-]+?)-quiz$/))&&U(m[1])&&live(U(m[1]))){u=U(m[1]);view.innerHTML=unitQuiz(u);unitQuizWire(u);tab='units';}
  else if((m=h.match(/^([a-z-]+?)-(\d+)$/))&&U(m[1])){u=U(m[1]);view.innerHTML=lesson(u,+m[2]);tab='units';
    if(u.lessons[+m[2]-1]){wireCards(view,u.words.filter(function(w){return inL(w,m[2]);}));quiz(u,+m[2]);}}
  else if(U(h)){view.innerHTML=unit(U(h));tab='units';}
  else if(h==='units'){view.innerHTML=units();tab='units';}
  else if(h==='tools'){view.innerHTML=tools();tab='tools';}
  else if(h==='words'||(m=h.match(/^words-(.+)$/))){var id=m?m[1]:null;if(view.dataset.wu!==String(id))lfilt='all';view.dataset.wu=String(id);view.innerHTML=words(id);wordsWire(id);tab='words';}
  else if(h==='games'||(m=h.match(/^games-(.+)$/))&&U(m[1])){view.innerHTML=games(m&&m[1]);tab='games';}
  else view.innerHTML=home();
  document.querySelectorAll('#nav a').forEach(function(a){a.classList.toggle('on',a.dataset.r===tab);});
  view.querySelectorAll('[data-play]').forEach(function(b){b.onclick=function(){play(b.dataset.play);};});
  view.querySelectorAll('[data-tool]').forEach(function(b){b.onclick=function(){openTool(b.dataset.tool);};});
  var rl=document.getElementById('readLo');if(rl)rl.onclick=function(){say(speakable(view.querySelector('h1.lo').textContent));};
}

var lastHash=location.hash;
window.addEventListener('hashchange',function(){route();if(location.hash!==lastHash)window.scrollTo(0,0);lastHash=location.hash;});
route();
})();
</script>
