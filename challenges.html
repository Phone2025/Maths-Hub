<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maths Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f6fdf">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>html{-webkit-text-size-adjust:100%}button,a,[role=button],summary,label{touch-action:manipulation}input,select,textarea{font-size:max(16px,1em)}#drawerBtn,.drawer-btn{bottom:calc(16px + env(safe-area-inset-bottom))!important}</style>

<title>Maths Challenges</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
:root{--bg:#f5f7fb;--card:#fff;--line:#dde4ef;--ink:#14213d;--soft:#4f5d75;--accent:#2f6fdf;--gold:#e8a800;--ok:#1f9d63;--warn:#d2570f;--tint:#eef3fb;--font:'Lexend','Segoe UI',Verdana,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;padding:14px max(14px,env(safe-area-inset-left,0px)) 40px}
body.big{zoom:1.15}
body.still *{transition:none!important;animation:none!important}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:22px} h2{margin:0;font-size:20px}
p{margin:0;line-height:1.5}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.btn{font:600 15px var(--font);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
.btn.p,.tabs .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.soft{color:var(--soft);font-size:15px}
.credit{font-size:13px;color:var(--soft)}
.msg{font-weight:600;padding:12px 14px;border-radius:12px;background:var(--tint)}
.msg.win{background:#e3f6ec;color:#11633f}.msg.lose{background:#fdeee4;color:#8a3a0c}
body.low{--bg:#fbf6e9;--card:#fffdf7;--line:#d8cfb8;--ink:#000;--soft:#222;--tint:#f3eddc;background:#fbf6e9}
body.low *{box-shadow:none!important;animation:none!important;transition:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* dicey */
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.board{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center}
.board h3{margin:0;font-size:16px}
.grid3{display:grid;grid-template-columns:34px repeat(3,58px);gap:6px;align-items:center;justify-items:center}
.grid3 .hd{font-size:13px;font-weight:700;color:var(--soft)}
.cell{width:58px;height:58px;border-radius:12px;border:2px dashed #b9c6da;background:#fbfcfe;font:700 28px var(--font);color:var(--ink);display:flex;align-items:center;justify-content:center}
button.cell{cursor:pointer}
button.cell.open{border-color:var(--accent);background:#eef4ff}
.cell.full{border-style:solid;border-color:var(--line);background:#fff}
.cell.ans{border-style:solid;border-color:var(--ok);background:#e3f6ec;color:#11633f}
.opsym{font:700 26px var(--font)}
.rule{grid-column:2/5;height:3px;background:var(--ink);width:100%;border-radius:2px}
.die{width:84px;height:84px;border-radius:18px;background:#fff;border:3px solid var(--ink);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:10px;box-shadow:0 4px 0 #c9d3e3}
.die i{width:14px;height:14px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die.roll{animation:spin .5s ease}
@keyframes spin{0%{transform:rotate(0) scale(.8)}60%{transform:rotate(200deg) scale(1.08)}100%{transform:rotate(360deg) scale(1)}}
/* got it */
.track{display:flex;flex-wrap:wrap;gap:6px}
.track span{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;border:2px solid var(--line);background:#fff}
.track span.past{background:var(--tint);color:var(--soft)}
.track span.now{background:var(--gold);border-color:var(--gold);color:var(--ink);transform:scale(1.12)}
.track span.tgt{border-color:var(--ok);color:var(--ok)}
.track span.key{box-shadow:inset 0 0 0 3px #8a4fd6}
.big2{font-size:44px;font-weight:700;text-align:center}
.log{font-size:15px;color:var(--soft);display:flex;flex-wrap:wrap;gap:6px}
.log b{padding:3px 9px;border-radius:999px;background:var(--tint);color:var(--ink);font-weight:600}
.log b.c{background:#f3eafd}
/* digit addition */
table.res{border-collapse:collapse;width:100%;font-size:16px}
table.res th,table.res td{border:1px solid var(--line);padding:8px;text-align:center}
table.res th{background:var(--tint);font-size:14px}
.calc{display:grid;grid-template-columns:30px repeat(3,46px);gap:4px;font:700 30px var(--font);justify-items:center;align-items:center}
.pad{display:flex;flex-wrap:wrap;gap:6px}
.pad .btn{width:56px}
.numshow{font:700 40px var(--font);min-width:110px;text-align:center;padding:6px 14px;border-radius:12px;background:var(--tint)}
/* what shape */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.shp{border:2px solid var(--line);border-radius:14px;background:#fff;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:600 12px var(--font);color:var(--ink);position:relative}
.shp svg{width:72px;height:72px}
.shp.out{opacity:.28}
.shp.out::after{content:'';position:absolute;inset:10px;background:linear-gradient(45deg,transparent 47%,#d2570f 47%,#d2570f 53%,transparent 53%)}
.shp.guess{border-color:var(--accent);border-style:dashed}
.shp.win{border-color:var(--ok);background:#e3f6ec;opacity:1}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.qs .btn{text-align:left;font-weight:500}
.qs .btn.asked{opacity:.45}
.ans{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.ans div{font-size:15px;padding:7px 10px;border-radius:10px;background:var(--tint)}
.ans .y{font-weight:700;color:var(--ok)} .ans .n{font-weight:700;color:var(--warn)}
/* rounding */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.rcirc{aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;grid-template-rows:auto 1fr 1fr;padding:6px 0 0;overflow:hidden;font:inherit;color:var(--ink);cursor:default}
.rcirc .rl{font-weight:700;font-size:14px;color:var(--soft)}
.rcirc .rh{display:flex;align-items:center;justify-content:center;font-size:20px}
.rcirc .rh+.rh{border-top:2px solid var(--ink)}
.rcirc.can{cursor:pointer;border-color:var(--accent);box-shadow:0 0 0 3px #cfe0ff}
.p0{color:#2f6fdf}.p1{color:#d2570f}
.sc{font-weight:700;padding:6px 12px;border-radius:999px;background:var(--tint)}
.dice2{width:46px;height:46px;border-radius:10px;border:3px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font:700 24px var(--font);background:#fff}
/* maze */
.mzg{display:grid;gap:6px;max-width:460px}
.mz{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:#fff;font:700 22px var(--font);color:var(--ink);cursor:pointer;position:relative}
.mz.on{background:#fff3cf;border-color:var(--gold)}
.mz.last{background:var(--gold)}
.mz.nx{border-color:var(--accent);border-style:dashed}
.mz.st::before,.mz.en::before{position:absolute;top:2px;left:0;right:0;font-size:9px;letter-spacing:.06em;color:var(--soft)}
.mz.st::before{content:'START'}.mz.en::before{content:'END'}
/* make 100 */
.mkrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center}
.mkd{font:700 30px var(--font);width:30px;text-align:center}
.mko{width:44px;height:44px;border-radius:10px;border:2px solid var(--accent);background:#eef4ff;font:700 22px var(--font);color:var(--ink);cursor:pointer}
.mko.j{border-style:dashed;background:#fff;color:var(--soft)}
@media (max-width:520px){.cell{width:48px;height:48px;font-size:24px}.grid3{grid-template-columns:30px repeat(3,48px)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Maths challenges</h1>
  <div class="tabs" id="tabs"></div>
  <div id="app"></div>
  <p class="credit">These games are based on ideas from NRICH (nrich.maths.org), University of Cambridge.</p>
</div>
<script id="mh-voice">/* Maths Hub voice: picks the most natural English voice on this device and applies the reader's settings */
(function(){var ss=window.speechSynthesis;if(!ss||ss.__mh)return;ss.__mh=1;var orig=ss.speak.bind(ss);
function A(){try{return JSON.parse(localStorage.getItem('mh-a11y')||'{}')||{};}catch(e){return {};}}
var BAD=/compact|espeak|robot|novelty|bad news|bells|whisper|zarvox|trinoids|albert|jester|organ|cellos|bubbles|boing|deranged|hysterical|superstar|wobble|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley|good news|junior|ralph|fred|kathy|vicki|victoria/;
function rank(v){var n=v.name.toLowerCase(),l=(v.lang||'').toLowerCase().replace('_','-'),s=0;if(l.indexOf('en')!==0)return -1;
  if(l==='en-gb')s+=30;else if(l==='en-ie'||l==='en-au'||l==='en-nz')s+=16;else s+=10;
  if(/natural|neural/.test(n))s+=45;if(/online/.test(n))s+=8;if(/premium/.test(n))s+=42;if(/enhanced/.test(n))s+=36;if(/siri/.test(n))s+=30;
  if(/google uk english female/.test(n))s+=26;else if(/google uk english/.test(n))s+=22;else if(/google/.test(n))s+=12;
  if(/sonia|libby|maisie|abbi|bella|hollie|olivia|serena|kate|stephanie|martha|daniel|arthur|oliver|jamie/.test(n))s+=12;
  if(BAD.test(n))s-=80;return s;}
function list(){return ss.getVoices().filter(function(v){return rank(v)>=0;}).sort(function(a,b){return rank(b)-rank(a);});}
function best(){var a=A(),vs=ss.getVoices();if(a.voice){var f=vs.filter(function(v){return v.name===a.voice;})[0];if(f)return f;}return list()[0]||null;}
ss.speak=function(u){try{var v=best();if(v){u.voice=v;u.lang=v.lang;}var a=A();u.rate=a.slow?0.8:0.97;u.pitch=1;
  if(u.text)u.text=u.text.replace(/\s*\n+\s*/g,'. ').replace(/\s{2,}/g,' ');}catch(e){}return orig(u);};
window.MH_VOICES=list;window.MH_VOICE_RANK=rank;
try{ss.getVoices();if(typeof ss.addEventListener==='function')ss.addEventListener('voiceschanged',function(){});}catch(e){}
})();
</script>
<script>
(function(){
var A={};try{A=JSON.parse(localStorage.getItem('mh-a11y')||'{}')||{};}catch(e){}
document.body.classList.toggle('big',!!A.big);document.body.classList.toggle('still',!!A.still||!!A.low);document.body.classList.toggle('low',!!A.low);
var APP=document.getElementById('app');
function say(t){try{var u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=A.slow?.7:.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function rnd(n){return Math.floor(Math.random()*n);}
function readBtn(id){return '<button class="btn" type="button" id="'+id+'">Read aloud</button>';}
var G={rounding:'Rounding Game',dicey:'Dicey Operations',gotit:'Got It!',reach100:'Reach 100',make100:'Make 100',maze100:'Maze 100',digitadd:'Digit Addition',supershapes:'Super Shapes',alldigits:'All the Digits',whatshape:'What Shape?'};
function tabs(cur){document.getElementById('tabs').innerHTML=Object.keys(G).map(function(k){return '<button type="button" class="btn'+(k===cur?' on':'')+'" data-k="'+k+'">'+G[k]+'</button>';}).join('');
  document.querySelectorAll('#tabs [data-k]').forEach(function(b){b.onclick=function(){location.hash=b.dataset.k;};});}

/* ================= DICEY OPERATIONS ================= */
var DI={mode:'add',you:null,cpu:null,left:6,roll:0,placed:true,done:false};
var DIPIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function diTarget(){return DI.mode==='add'?1000:100;}
function diVal(g){var a=g[0]*100+g[1]*10+g[2],b=g[3]*100+g[4]*10+g[5];return DI.mode==='add'?a+b:Math.abs(a-b);}
function diNew(){DI.you=[null,null,null,null,null,null];DI.cpu=[null,null,null,null,null,null];DI.left=6;DI.roll=0;DI.placed=true;DI.done=false;}
function diCpuPlace(d){var best=-1,bs=1e9;for(var s=0;s<6;s++){if(DI.cpu[s]!==null)continue;var tot=0;for(var k=0;k<160;k++){var g=DI.cpu.slice();g[s]=d;for(var t=0;t<6;t++)if(g[t]===null)g[t]=1+rnd(6);tot+=Math.abs(diVal(g)-diTarget());}if(tot<bs){bs=tot;best=s;}}DI.cpu[best]=d;}
function diBoard(g,who,mine){var op=DI.mode==='add'?'+':'−',full=g.every(function(x){return x!==null;});
  var cell=function(i){var v=g[i];if(mine&&v===null&&!DI.placed)return '<button type="button" class="cell open" data-s="'+i+'" aria-label="Put the '+DI.roll+' here"></button>';return '<div class="cell'+(v!==null?' full':'')+'">'+(v===null?'':v)+'</div>';};
  var ans='';if(full){var v=diVal(g),s=String(v).padStart(DI.mode==='add'?4:3,' ');}
  return '<div class="board"><h3>'+who+'</h3><div class="grid3"><span></span><span class="hd">H</span><span class="hd">T</span><span class="hd">O</span><span></span>'+cell(0)+cell(1)+cell(2)+'<span class="opsym">'+op+'</span>'+cell(3)+cell(4)+cell(5)+'<span></span><div class="rule"></div>'+
   (full?(DI.mode==='add'&&v>=1000?'<span class="opsym" style="font-size:20px">'+String(v)[0]+'</span>':'<span></span>')+String(v%1000).padStart(3,'0').split('').map(function(c,i){return '<div class="cell ans">'+(v<100&&i===0&&DI.mode!=='add'?'':v<10&&i===1&&DI.mode!=='add'?'':c)+'</div>';}).join(''):'<span></span><div class="cell"></div><div class="cell"></div><div class="cell"></div>')+'</div>'+
   (full?'<p><b>'+v+'</b> is '+Math.abs(v-diTarget())+' away from '+diTarget()+'.</p>':'')+'</div>';}
function diDie(n){var on=DIPIPS[n]||[];return '<div class="die" id="die" aria-label="Die shows '+(n||'nothing')+'">'+[0,1,2,3,4,5,6,7,8].map(function(i){return '<i style="'+(on.indexOf(i)>=0?'visibility:visible':'')+'"></i>';}).join('')+'</div>';}
function dicey(){if(!DI.you)diNew();var tgt=diTarget(),msg='';
  if(DI.done){var y=Math.abs(diVal(DI.you)-tgt),c=Math.abs(diVal(DI.cpu)-tgt);msg='<div class="msg '+(y<c?'win':y>c?'lose':'')+'">'+(y<c?'You win! You were closer to '+tgt+'.':y>c?'The computer was closer this time. Try a different plan!':'It is a draw!')+'</div>';}
  APP.innerHTML='<div class="card"><h2>Dicey Operations</h2><p>Roll the die 6 times. After each roll, choose a box for the digit. Make your '+(DI.mode==='add'?'answer as close to <b>1000</b>':'difference as close to <b>100</b>')+' as you can. The computer gets the same rolls.</p>'+
   '<div class="row"><span class="soft">Game:</span><button type="button" class="btn'+(DI.mode==='add'?' p':'')+'" data-m="add">Addition: closest to 1000</button><button type="button" class="btn'+(DI.mode==='sub'?' p':'')+'" data-m="sub">Subtraction: closest to 100</button>'+readBtn('rdD')+'</div>'+
   '<div class="row" style="gap:16px">'+diDie(DI.roll)+'<div><button type="button" class="btn go" id="rollB" '+(DI.placed&&DI.left>0?'':'disabled')+'>'+(DI.left===6?'Roll the die':'Roll again')+'</button><p class="soft" style="margin-top:6px">'+(DI.done?'Game over.':DI.placed?DI.left+' roll'+(DI.left===1?'':'s')+' left.':'You rolled a <b>'+DI.roll+'</b>. Tap a box to place it.')+'</p></div></div>'+
   '<div class="boards">'+diBoard(DI.you,'You',true)+diBoard(DI.cpu,'Computer',false)+'</div>'+msg+
   '<div class="row"><button type="button" class="btn" id="newD">New game</button><span class="soft">Think: where should a big number go? Where should a small one go?</span></div></div>';
  APP.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){DI.mode=b.dataset.m;diNew();dicey();};});
  document.getElementById('newD').onclick=function(){diNew();dicey();};
  document.getElementById('rdD').onclick=function(){say('Roll the die 6 times. After each roll, choose a box for the digit. Try to make your '+(DI.mode==='add'?'answer as close to one thousand':'difference as close to one hundred')+' as you can.');};
  var rb=document.getElementById('rollB');rb.onclick=function(){DI.roll=1+rnd(6);DI.left--;DI.placed=false;diCpuPlace(DI.roll);dicey();var d=document.getElementById('die');if(d&&!A.still){d.classList.add('roll');}say('You rolled a '+DI.roll);};
  APP.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){DI.you[+b.dataset.s]=DI.roll;DI.placed=true;if(DI.left===0)DI.done=true;dicey();};});}

/* ================= GOT IT! ================= */
var GI={target:23,max:4,opp:'hard',total:0,turn:0,log:[],over:false,keys:false,wins:0,games:0};
function giNew(){GI.total=0;GI.turn=0;GI.log=[];GI.over=false;}
function giCpu(){var t=GI.target,m=GI.max,need=(t-GI.total)%(m+1);var add=(GI.opp==='hard'&&need>0)?need:1+rnd(Math.min(m,t-GI.total));if(GI.opp==='easy'&&Math.random()<.25&&need>0)add=need;giMove(add,'Computer');}
function giMove(n,who){GI.total+=n;GI.log.push([who,n,GI.total]);if(GI.total===GI.target){GI.over=who;GI.games++;if(who==='You'||who==='Player 1')GI.wins++;}else GI.turn=1-GI.turn;gotit();
  if(!GI.over&&GI.opp!=='friend'&&GI.turn===1)setTimeout(giCpu,A.still?200:800);}
function gotit(){var t=GI.target,m=GI.max,p1=GI.opp==='friend'?'Player 1':'You',p2=GI.opp==='friend'?'Player 2':'Computer',cur=GI.turn===0?p1:p2,keyset={};for(var k=t;k>=0;k-=m+1)keyset[k]=1;
  APP.innerHTML='<div class="card"><h2>Got It!</h2><p>Start at <b>0</b>. Take turns to add a number from <b>1 to '+m+'</b>. The player who makes the total exactly <b>'+t+'</b> wins.</p>'+
   '<div class="row"><span class="soft">Target:</span>'+[15,20,23,30].map(function(v){return '<button type="button" class="btn'+(t===v?' p':'')+'" data-t="'+v+'">'+v+'</button>';}).join('')+'<span class="soft">Add up to:</span>'+[3,4,5].map(function(v){return '<button type="button" class="btn'+(m===v?' p':'')+'" data-x="'+v+'">'+v+'</button>';}).join('')+'</div>'+
   '<div class="row"><span class="soft">Play against:</span>'+[['easy','Computer (easy)'],['hard','Computer (hard)'],['friend','A friend']].map(function(o){return '<button type="button" class="btn'+(GI.opp===o[0]?' p':'')+'" data-o="'+o[0]+'">'+o[1]+'</button>';}).join('')+readBtn('rdG')+'</div>'+
   '<div class="track" aria-label="Number track">'+Array.from({length:t+1},function(_,i){return '<span class="'+(i===GI.total?'now':i<GI.total?'past':'')+(i===t?' tgt':'')+(GI.keys&&keyset[i]?' key':'')+'">'+i+'</span>';}).join('')+'</div>'+
   '<div class="big2">'+GI.total+'</div>'+
   (GI.over?'<div class="msg '+(GI.over==='Computer'?'lose':'win')+'">'+(GI.over==='Computer'?'The computer got it! Can you work out its secret?':GI.over+' got it!')+'</div>':'<p style="text-align:center;font-weight:600">'+(GI.opp!=='friend'&&GI.turn===1?'The computer is thinking…':cur+': choose how much to add.')+'</p>')+
   '<div class="row" style="justify-content:center">'+Array.from({length:m},function(_,i){var n=i+1;return '<button type="button" class="btn go" style="min-width:64px;font-size:20px" data-a="'+n+'" '+(GI.over||(GI.opp!=='friend'&&GI.turn===1)||GI.total+n>t?'disabled':'')+'>+'+n+'</button>';}).join('')+'</div>'+
   '<div class="log">'+GI.log.map(function(l){return '<b class="'+(l[0]==='Computer'||l[0]==='Player 2'?'c':'')+'">'+l[0]+' +'+l[1]+' → '+l[2]+'</b>';}).join('')+'</div>'+
   '<div class="row"><button type="button" class="btn" id="newG">New game</button><button type="button" class="btn" id="keyG">'+(GI.keys?'Hide':'Show')+' the secret numbers</button>'+(GI.games?'<span class="soft">You have won '+GI.wins+' of '+GI.games+' games.</span>':'')+'</div>'+
   '<p class="soft">Think: which number do you want to land on just before '+t+'? And before that?</p>'+(GI.keys?'<p class="soft">The secret numbers are <b>'+Object.keys(keyset).map(Number).sort(function(a,b){return a-b;}).join(', ')+'</b>. They go up in '+(m+1)+'s. Land on these and you can always win!</p>':'')+'</div>';
  APP.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){GI.target=+b.dataset.t;giNew();gotit();};});

var MZS=[[[6,20,4,10,5],[17,16,17,14,8],[5,17,2,14,15],[2,16,10,9,20]],[[11,20,16,11,14],[13,2,16,13,7],[5,17,3,8,11],[6,9,14,14,17]],[[20,3,17,9,14],[15,7,13,19,13],[4,16,18,5,7],[18,14,13,17,2]]];
