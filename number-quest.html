<title>Number Quest Arcade</title>

<style>
*{box-sizing:border-box}
body{margin:0}
/* Layout: a calm, dark puzzle-game console. A slim header, one stage panel with a blueprint grid, the question beneath it, and a grid of flat control tiles. Deliberately single-theme (dark) so every classroom screen matches. */
:root{
  --bg:#0d1524; --panel:#141f33; --stage:#111b2d; --tile:#1b2840; --tile-hi:#22324d; --edge:#2b3b57;
  --fg:#e6edf7; --muted:#9aaac2; --faint:#6b7a93;
  --cw:#5b9bff; --acw:#ff8a3d; --ok:#3dd68c; --ok-ink:#07210f; --gold:#f5c451; --life:#ff5d73;
  --font:'Lexend', 'Segoe UI', Verdana, sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font); font-size:17px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 40px;
}
.wrap{max-width:540px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
.topbar{display:flex; align-items:center; gap:10px}
.logo{flex:1; min-width:0; margin:0; display:flex; flex-direction:column; gap:2px}
.logo b{font-size:20px; font-weight:700; letter-spacing:.18em}
.logo span{font-size:12px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.pill{font:500 14px var(--font); color:var(--fg); background:var(--tile); border:1px solid var(--edge); border-radius:10px; padding:9px 14px; cursor:pointer}
.pill:hover{background:var(--tile-hi)}
.panel{background:var(--panel); border:1px solid var(--edge); border-radius:18px; overflow:hidden}
.hud{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 16px; font-size:14px; font-weight:500; color:var(--muted); font-variant-numeric:tabular-nums}
.hud .lives{display:flex; align-items:center; gap:6px; text-transform:uppercase; letter-spacing:.12em; font-size:12px}
.hud .pip{width:10px; height:10px; border-radius:50%; background:var(--life)}
.hud .pip.off{background:transparent; box-shadow:inset 0 0 0 2px var(--edge)}
.hud .r{color:var(--fg)}
.stage{background:var(--stage); border-block:1px solid var(--edge)}
canvas{display:block; width:100%; height:auto; aspect-ratio:320/288; max-width:100%}
.prompt{min-height:8em; padding:16px 18px 18px; font-size:19px; line-height:1.5; display:flex; flex-direction:column; gap:6px}
.prompt b{font-weight:600; color:#ffffff}
.prompt .big{font-size:22px; font-weight:600; letter-spacing:.01em}
.prompt .big.good{color:var(--ok)}
.prompt .big.bad{color:var(--acw)}
.prompt .note{color:var(--muted);font-size:16px}
.chip{display:inline-block; padding:0 9px; border-radius:7px; font-weight:600; font-size:.92em}
.chip.cw{color:var(--cw); background:rgba(91,155,255,.14); border:1px solid rgba(91,155,255,.5)}
.chip.acw{color:var(--acw); background:rgba(255,138,61,.12); border:1px dashed var(--acw)}
.code{display:flex; flex-wrap:wrap; gap:6px; min-height:30px}
.code span{background:var(--tile); border:1px solid var(--edge); padding:2px 10px; font-size:15px; font-weight:500; border-radius:8px}
.code span.r{border-color:var(--cw); color:var(--cw)}
.code span.l{border-color:var(--acw); color:var(--acw); border-style:dashed}
.code .empty{background:none; border:0; color:var(--faint); padding:0}
.panel.shake canvas{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.answers{display:grid; grid-template-columns:repeat(var(--cols,2), minmax(0,1fr)); gap:10px}
.key{
  font:500 18px/1.2 var(--font); color:var(--fg); background:var(--tile);
  border:1px solid var(--edge); border-radius:14px; padding:12px 10px; min-height:62px;
  cursor:pointer; text-wrap:balance; transition:background .12s, border-color .12s, transform .08s;
}
.key small{display:block; font-size:13px; font-weight:400; color:var(--muted); margin-top:3px}
.key:hover{background:var(--tile-hi)}
.key:active{transform:scale(.98)}
.key.sel{border-color:var(--cw)}
.key:focus-visible{outline:2px solid var(--cw); outline-offset:2px}
.key.run{background:var(--ok); border-color:var(--ok); color:var(--ok-ink); font-weight:600}
.key.run small{color:var(--ok-ink); opacity:.75}
.key.cwk{color:var(--cw)} .key.acwk{color:var(--acw); border-style:dashed}
.key.wide{grid-column:1 / -1}
.key .sw{display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-1px; margin-right:8px}
button:focus-visible{outline:2px solid var(--cw); outline-offset:2px}
@media (prefers-reduced-motion: reduce){ .panel.shake canvas{animation:none} .key{transition:none} }
@media (max-width:400px){ .key{font-size:16px} .prompt{font-size:17px} }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <h1 class="logo"><b>NUMBER QUEST</b><span>Place value · + − × ÷ · Statistics · Year 3</span></h1>
    <button class="pill" id="btnSound" type="button">Sound: on</button>
    <button class="pill" id="btnMenu" type="button">Menu</button>
  </div>

  <div class="panel" id="card">
    <div class="hud" id="hud"></div>
    <div class="stage"><canvas id="cv" width="640" height="576" aria-label="Game picture"></canvas></div>
    <div class="prompt" id="prompt" aria-live="polite"></div>
  </div>

  <div class="answers" id="answers"></div>
</div>

<style id="a11y-css">
body.big .prompt{font-size:23px;line-height:1.55}
body.big .prompt .big{font-size:27px}
body.big .key{font-size:20px;min-height:64px}
body.big .hud{font-size:16px}
body.still *{transition:none!important;animation:none!important}
.a11y-read{background:#f5c451!important;color:#14213d!important;border-color:#f5c451!important;font-weight:700!important}
.a11y-panel{position:fixed;z-index:30;top:60px;right:12px;width:min(320px,calc(100vw - 24px));background:#16233a;border:1px solid #2b3b57;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.4);font-size:16px}
.a11y-panel[hidden]{display:none}
.a11y-panel h2{margin:0;font-size:17px}
.a11y-panel label{display:flex;gap:10px;align-items:center;cursor:pointer;min-height:40px}
.a11y-panel input{width:22px;height:22px;accent-color:#f5c451}
.topbar{flex-wrap:wrap;row-gap:8px}
.topbar .logo{flex:1 1 230px;min-width:200px}
.topbar .logo b{white-space:nowrap}
</style>
<script id="mh-voice">/* Maths Hub voice: picks the most natural English voice on this device and applies the reader's settings */
(function(){var ss=window.speechSynthesis;if(!ss||ss.__mh)return;ss.__mh=1;var orig=ss.speak.bind(ss);
function A(){try{return JSON.parse(localStorage.getItem('mh-a11y')||'{}')||{};}catch(e){return {};}}
var BAD=/compact|espeak|robot|novelty|bad news|bells|whisper|zarvox|trinoids|albert|jester|organ|cellos|bubbles|boing|deranged|hysterical|superstar|wobble|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley|good news|junior|ralph|fred|kathy|vicki|victoria/;
function rank(v){var n=v.name.toLowerCase(),l=(v.lang||'').toLowerCase().replace('_','-'),s=0;if(l.indexOf('en')!==0)return -1;
  if(l==='en-gb')s+=30;else if(l==='en-ie'||l==='en-au'||l==='en-nz')s+=16;else s+=10;
  if(/natural|neural/.test(n))s+=45;if(/online/.test(n))s+=8;if(/premium/.test(n))s+=42;if(/enhanced/.test(n))s+=36;if(/siri/.test(n))s+=30;
  if(/google uk english female/.test(n))s+=26;else if(/google uk english/.test(n))s+=22;else if(/google/.test(n))s+=12;
  if(/sonia|libby|maisie|abbi|bella|hollie|olivia|serena|kate|stephanie|martha|daniel|arthur|oliver|jamie/.test(n))s+=12;
  if(BAD.test(n))s-=80;return s;}
function list(){return ss.getVoices().filter(function(v){return rank(v)>=0;}).sort(function(a,b){return rank(b)-rank(a);});}
function best(){var a=A(),vs=ss.getVoices();if(a.voice){var f=vs.filter(function(v){return v.name===a.voice;})[0];if(f)return f;}return list()[0]||null;}
ss.speak=function(u){try{var v=best();if(v){u.voice=v;u.lang=v.lang;}var a=A();u.rate=a.slow?0.8:0.97;u.pitch=1;
  if(u.text)u.text=u.text.replace(/\s*\n+\s*/g,'. ').replace(/\s{2,}/g,' ');}catch(e){}return orig(u);};
window.MH_VOICES=list;window.MH_VOICE_RANK=rank;
try{ss.getVoices();if(typeof ss.addEventListener==='function')ss.addEventListener('voiceschanged',function(){});}catch(e){}
})();
</script>
<script>
function speakable(t){
  var D={2:['half','halves'],3:['third','thirds'],4:['quarter','quarters'],5:['fifth','fifths'],6:['sixth','sixths'],7:['seventh','sevenths'],8:['eighth','eighths'],9:['ninth','ninths'],10:['tenth','tenths'],12:['twelfth','twelfths'],100:['hundredth','hundredths']};
  var N=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
  t=String(t).replace(/½/g,' 1/2').replace(/¼/g,' 1/4').replace(/¾/g,' 3/4').replace(/\s+/g,' ').trim();
  t=t.replace(/(\d)\s?mm\b/g,'$1 millimetres').replace(/(\d)\s?cm\b/g,'$1 centimetres').replace(/(\d)\s?km\b/g,'$1 kilometres').replace(/(\d)\s?kg\b/g,'$1 kilograms').replace(/(\d)\s?ml\b/g,'$1 millilitres').replace(/(\d)\s?g\b/g,'$1 grams').replace(/(\d)\s?l\b/g,'$1 litres').replace(/(\d)\s?m\b/g,'$1 metres').replace(/(\d)p\b/g,'$1 pence');
  t=t.replace(/(^|[^\d\/])(\d{1,2})\/(\d{1,3})(?![\d\/])/g,function(m,p,a,b){a=+a;b=+b;var w=D[b]?(N[a]||a)+' '+D[b][a===1?0:1]:a+' over '+b;if(a===b&&b>1)w+=', one whole';return p+w;});
  t=t.replace(/_{2,}|☐/g,' blank ');
  t=t.replace(/(^|[\s(=+\-−×÷])\?(?=\s*[+\-−×÷=])/g,'$1 what number ').replace(/([=+\-−×÷]\s*)\?/g,'$1 what number');
  t=t.replace(/=\s*$/,' equals what?').replace(/…\s*$/,' what?').replace(/…/g,', ');
  t=t.replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/−/g,' minus ').replace(/\s\+\s|\+/g,' plus ').replace(/=/g,' equals ').replace(/\s<\s/g,' is less than ').replace(/\s>\s/g,' is greater than ');
  t=t.replace(/(^|[^\d,.\/])1 (millimetre|centimetre|kilometre|kilogram|millilitre|gram|litre|metre)s\b/g,'$1one $2').replace(/(half|quarter|third|fifth|tenth) (millimetre|centimetre|kilometre|kilogram|millilitre|gram|litre|metre)s\b/g,'$1 a $2').replace(/\bone half a /g,'half a ').replace(/\bone (quarter|third|fifth|tenth) a /g,'a $1 of a ');
  t=t.replace(/[↻↺→←↑↓✓✗★☆♥]/g,'').replace(/\s+/g,' ').trim();
  return t;
}

(function(){
  var A={};try{A=JSON.parse(localStorage.getItem('mh-a11y')||'{}')||{};}catch(e){}
  window.A11Y=A;
  if(A.low)A.still=true;if(A.still){var mm=window.matchMedia;window.matchMedia=function(q){if(/prefers-reduced-motion/.test(q))return {matches:true,media:q,addListener:function(){},removeListener:function(){},addEventListener:function(){},removeEventListener:function(){}};return mm.call(window,q);};}
  try{if(window.speechSynthesis){var sp=speechSynthesis.speak.bind(speechSynthesis);speechSynthesis.speak=function(u){if(A.slow)u.rate=Math.min(u.rate||1,.7);return sp(u);};}}catch(e){}
  var SKIP=/^(Next|Back|Skip to game|Read to me|Menu|Play again|Learn again|Start|Play|Read aloud)\b/i;
  function textOf(el){var c=el.cloneNode(true);c.querySelectorAll('.fr').forEach(function(f){var b=f.querySelector('b'),i=f.querySelector('i');f.textContent=' '+(b?b.textContent:'')+'/'+(i?i.textContent:'')+' ';});c.querySelectorAll('small').forEach(function(s){s.textContent=', '+s.textContent;});c.querySelectorAll('span,b,div').forEach(function(s){s.insertAdjacentText('afterend',' ');});return c.textContent.replace(/\s+/g,' ').trim();}
  function promptText(p){return [].slice.call(p.children).map(function(c){var x=textOf(c);return x&&!/[.?!:]$/.test(x)?x+'.':x;}).join(' ')||textOf(p);}
  function tidy(x){return x.replace(/equals\s*\./g,'equals what?').replace(/\s+([.,?!])/g,'$1').replace(/([?!.])\.+/g,'$1').replace(/\s+/g,' ').trim();}
  function readNow(){var p=document.getElementById('prompt'),a=document.getElementById('answers');if(!p)return;
    var t=promptText(p),opts=[].slice.call(a?a.querySelectorAll('button'):[]).map(textOf).filter(function(x){return x&&!SKIP.test(x);});
    if(/^Choose a game/.test(t))opts=[];
    var s=tidy(speakable(t)+(opts.length&&opts.length<=8?' Is it '+opts.map(speakable).join(', or ')+'?':''));
    try{var u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
  window.A11Y.read=readNow;
  function save(){try{localStorage.setItem('mh-a11y',JSON.stringify({big:A.big,slow:A.slow,still:A.still,auto:A.auto}));}catch(e){}}
  document.addEventListener('DOMContentLoaded',function(){
    document.body.classList.toggle('big',!!A.big);document.body.classList.toggle('still',!!A.still);
    var bar=document.querySelector('.topbar'),menu=document.getElementById('btnMenu');if(!bar)return;
    var rb=document.createElement('button');rb.className='pill a11y-read';rb.type='button';rb.id='btnRead';rb.textContent='Read aloud';rb.onclick=readNow;
    var sb=document.createElement('button');sb.className='pill';sb.type='button';sb.id='btnA11y';sb.textContent='Settings';sb.setAttribute('aria-expanded','false');
    bar.insertBefore(rb,bar.querySelector('.pill'));bar.insertBefore(sb,menu);
    var pn=document.createElement('div');pn.className='a11y-panel';pn.hidden=true;pn.setAttribute('role','dialog');pn.setAttribute('aria-label','Settings');
    var opts=[['big','Bigger text'],['slow','Slower speech'],['still','Less movement'],['auto','Read each question out automatically']];
    pn.innerHTML='<h2>Settings</h2>'+opts.map(function(o){return '<label><input type="checkbox" data-k="'+o[0]+'"'+(A[o[0]]?' checked':'')+'> '+o[1]+'</label>';}).join('')+'<button class="pill" type="button" id="a11yDone">Done</button>';
    document.body.appendChild(pn);
    sb.onclick=function(){pn.hidden=!pn.hidden;sb.setAttribute('aria-expanded',String(!pn.hidden));};
    pn.querySelector('#a11yDone').onclick=function(){pn.hidden=true;sb.setAttribute('aria-expanded','false');};
    pn.querySelectorAll('input').forEach(function(c){c.onchange=function(){A[c.dataset.k]=c.checked;save();
      if(c.dataset.k==='big')document.body.classList.toggle('big',c.checked);
      if(c.dataset.k==='still'){document.body.classList.toggle('still',c.checked);}};});
    var p=document.getElementById('prompt'),tm;
    if(p)new MutationObserver(function(){if(!A.auto)return;clearTimeout(tm);tm=setTimeout(function(){if(!/^Choose a game/.test(p.textContent.trim()))readNow();},350);}).observe(p,{childList:true,subtree:true,characterData:true});
  });
})();
</script>
<script>
(function(){
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d'); ctx.setTransform(2,0,0,2,0,0);
const C={fg:'#e6edf7',muted:'#9aaac2',faint:'#6b7a93',stage:'#111b2d',grid:'#1a2740',edge:'#2b3b57',tile:'#1b2840',gold:'#f5c451',ok:'#3dd68c',warn:'#ff8a3d',off:'#2b3b57'};
const HC='#5b9bff', TC='#3dd68c', OC='#f5c451', COLS=[HC,TC,OC], CN=['H','T','O'], CW=['hundreds','tens','ones'];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const promptEl=$('prompt'), hudEl=$('hud'), answersEl=$('answers'), cardEl=$('card');
const sleep=ms=>new Promise(r=>setTimeout(r,reduce?Math.min(ms,150):ms));
const rnd=n=>Math.floor(Math.random()*n), between=(a,b)=>a+rnd(b-a+1), pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const D3=n=>[Math.floor(n/100)%10,Math.floor(n/10)%10,n%10];
const fmt=n=>n>=1000?String(n).replace(/\B(?=(\d{3})+(?!\d))/g,','):String(n);

/* ---------- sound ---------- */
let actx=null, muted=false;
function beep(f,d,vol){ if(muted) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime; o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(vol||.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+(d||.12));
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+(d||.12)+.02);}catch(e){} }
const tune=n=>n.forEach(([f,t,d])=>setTimeout(()=>beep(f,d||.14),t));
const sGood=()=>tune([[587,0],[880,110,.25]]), sBad=()=>tune([[294,0,.2],[220,150,.28]]), sClick=()=>beep(1200,.03,.04), sWin=()=>tune([[523,0],[659,120],[784,240],[1047,360,.4]]), sStep=i=>beep(440+i*70,.09);

/* ---------- storage ---------- */
let best={}; try{ best=JSON.parse(localStorage.getItem('numberquest-best')||'{}')||{}; }catch(e){ best={}; }
function saveBest(k,v){ if(!(best[k]>=v)){ best[k]=v; try{ localStorage.setItem('numberquest-best',JSON.stringify(best)); }catch(e){} } }

/* ---------- drawing ---------- */
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function rrect(x,y,w,h,r,fill,stroke,lw){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||2;ctx.stroke();}}
function text(s,x,y,size,c,weight,align){ctx.fillStyle=c||C.fg;ctx.font=(weight||500)+' '+size+'px Lexend, sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function line(a,b,c,w,dash){ctx.strokeStyle=c;ctx.lineWidth=w||3;ctx.lineCap='round';ctx.setLineDash(dash?[6,6]:[]);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.setLineDash([]);}
function dot(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function badge(x,y,s,c){dot(x,y,11,c||C.gold);text(String(s),x,y+1,12,C.stage,700);}
function caption(s,col){ctx.font='600 13px Lexend, sans-serif';const w=ctx.measureText(s).width+20;rrect(160-w/2,264,w,20,10,'rgba(13,21,36,.9)');text(s,160,274.5,13,col||C.fg,600);}
function bg(){rect(0,0,320,288,C.stage);ctx.strokeStyle=C.grid;ctx.lineWidth=1;for(let x=16;x<320;x+=24){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,288);ctx.stroke();}for(let y=12;y<288;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(320,y);ctx.stroke();}}
const countUp=(t,n,dur)=>Math.min(n,Math.floor((t%((n+3)*dur))/dur));
/* place value chart */
function pvChart(n,x0,y0,w,o){o=o||{};const cw=w/3,d=D3(n);
  for(let i=0;i<3;i++){const x=x0+i*cw;rrect(x+3,y0,cw-6,30,8,COLS[i]+'33');text(CN[i],x+cw/2,y0+16,15,COLS[i],700);
    rrect(x+3,y0+36,cw-6,64,10,C.tile,o.hl===i?C.gold:C.edge,o.hl===i?3:1.5);
    text(o.hide===i?'?':String(d[i]),x+cw/2,y0+69,40,o.hl===i?C.gold:C.fg,700);
    if(o.vals&&o.vals>i) text(String(d[i]*[100,10,1][i]),x+cw/2,y0+118,15,COLS[i],600);}}
/* Dienes blocks */
function dienes(h,t,o,x,y,s){s=s||1;let cx=x;const S=40*s;
  for(let i=0;i<h;i++){rect(cx,y,S,S,HC+'55');ctx.strokeStyle=HC;ctx.lineWidth=1;for(let k=0;k<=10;k++){ctx.beginPath();ctx.moveTo(cx+k*S/10,y);ctx.lineTo(cx+k*S/10,y+S);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,y+k*S/10);ctx.lineTo(cx+S,y+k*S/10);ctx.stroke();}cx+=S+6;}
  for(let i=0;i<t;i++){rect(cx,y,S/10+2,S,TC+'66');ctx.strokeStyle=TC;ctx.lineWidth=1;ctx.strokeRect(cx,y,S/10+2,S);for(let k=1;k<10;k++){ctx.beginPath();ctx.moveTo(cx,y+k*S/10);ctx.lineTo(cx+S/10+2,y+k*S/10);ctx.stroke();}cx+=S/10+6;}
  cx+=4;for(let i=0;i<o;i++){const c=i%3,r=Math.floor(i/3);rect(cx+c*(S/10+5),y+S-(r+1)*(S/10+5)+5,S/10+2,S/10+2,OC);}}
/* number line */
function NLine(a,b,step,y,lab){const x0=30,x1=290,X=v=>x0+(v-a)/(b-a)*(x1-x0);
  line([x0-8,y],[x1+8,y],C.fg,3);for(let v=a;v<=b+1e-9;v+=step){line([X(v),y-9],[X(v),y+9],C.fg,2.5);}
  (lab||[a,b]).forEach(v=>text(fmt(v),X(v),y+24,13,C.muted,600));return X;}
function arrowDown(x,y,c){line([x,y-38],[x,y-12],c||C.gold,4);ctx.fillStyle=c||C.gold;ctx.beginPath();ctx.moveTo(x-8,y-16);ctx.lineTo(x+8,y-16);ctx.lineTo(x,y-4);ctx.closePath();ctx.fill();}
function hop(x1,x2,y,lbl,c){const m=(x1+x2)/2,hgt=Math.min(40,Math.abs(x2-x1)*.6+12);ctx.strokeStyle=c||C.gold;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x1,y-6);ctx.quadraticCurveTo(m,y-6-hgt*2,x2,y-6);ctx.stroke();
  const dir=Math.sign(x2-x1);ctx.fillStyle=c||C.gold;ctx.beginPath();ctx.moveTo(x2,y-4);ctx.lineTo(x2-dir*9,y-14);ctx.lineTo(x2+dir*2,y-16);ctx.closePath();ctx.fill();if(lbl)text(lbl,m,y-14-hgt,14,c||C.gold,700);}
/* column method */
function colCalc(a,b,op,k,cols){cols=cols||colWork(a,b,op);const x0=110,cw=50,yT=66,yB=110,yA=168;
  text(op,x0-30,yB,30,C.fg,600);
  for(let i=0;i<3;i++){const x=x0+i*cw+cw/2;text(CN[i],x,14,13,COLS[i],700);
    const tv=cols.top[i];text(String(D3(a)[i]),x,yT,30,(k>2-i&&tv.ch)?C.faint:C.fg,700);if(k>2-i&&tv.ch){line([x-12,yT+12],[x+12,yT-12],C.warn,2.5);text(String(tv.v),x+2,yT-30,16,C.warn,700);}
    text(String(D3(b)[i]),x,yB,30,C.fg,700);
    if(k>2-i){text(String(cols.ans[i]),x,yA,32,C.ok,700);if(cols.carry[i])text(String(cols.carry[i]),x,yA+26,15,C.gold,700);}}
  line([x0-6,136],[x0+3*cw+6,136],C.fg,3);line([x0-6,208],[x0+3*cw+6,208],C.fg,1.5);}
function colWork(a,b,op){const A=D3(a),Bd=D3(b),ans=[0,0,0],carry=[0,0,0],top=[{v:A[0]},{v:A[1]},{v:A[2]}];
  if(op==='+'){let c=0;for(let i=2;i>=0;i--){const s=A[i]+Bd[i]+c;ans[i]=s%10;c=s>=10?1:0;if(c&&i>0)carry[i-1]=1;}}
  else{const T=A.slice();for(let i=2;i>=0;i--){if(T[i]<Bd[i]){let j=i-1;while(T[j]===0){T[j]=9;top[j]={v:9,ch:true};j--;}T[j]--;top[j]={v:T[j],ch:true};T[i]+=10;top[i]={v:T[i],ch:true};}ans[i]=T[i]-Bd[i];}}
  return {ans,carry,top};}
/* bar model */
function barModel(whole,p1,p2,hide){const x0=40,w=240,y1=70,y2=130,h=40,f=p1/whole;
  rrect(x0,y1,w,h,6,'rgba(91,155,255,.25)',HC,2);text(hide==='w'?'?':fmt(whole),x0+w/2,y1+h/2,20,hide==='w'?C.gold:C.fg,700);
  rrect(x0,y2,w*f,h,6,'rgba(61,214,140,.2)',TC,2);text(hide==='a'?'?':fmt(p1),x0+w*f/2,y2+h/2,20,hide==='a'?C.gold:C.fg,700);
  rrect(x0+w*f,y2,w*(1-f),h,6,'rgba(245,196,81,.2)',OC,2);text(hide==='b'?'?':fmt(p2),x0+w*f+w*(1-f)/2,y2+h/2,20,hide==='b'?C.gold:C.fg,700);}
/* pictogram */
function symbol(x,y,frac,c){ctx.fillStyle=c||C.gold;ctx.beginPath();if(frac>=1)ctx.arc(x,y,10,0,Math.PI*2);else{ctx.moveTo(x,y-10);ctx.arc(x,y,10,-Math.PI/2,Math.PI/2,true);ctx.closePath();}ctx.fill();}
function picto(cats,vals,key,o){o=o||{};cats.forEach((c,i)=>{const y=40+i*48;text(c,48,y,14,o.hl===i?C.gold:C.fg,600);rect(84,y+22,220,1,C.edge);
  const n=vals[i]/key;for(let k=0;k<Math.ceil(n-1e-9);k++)symbol(98+k*26,y,Math.min(1,n-k),o.hl===i?C.gold:'#f5c451cc');
  if(o.shown&&o.shown.includes(i))text('= '+vals[i],300,y,15,C.ok,700,'right');});
  symbol(110,238,1);text('= '+key+(key===1?' child':' children'),126,239,14,C.fg,600,'left');text('Key',72,239,13,C.muted,600);}
/* bar chart */
function bars(cats,vals,scale,steps,o){o=o||{};const x0=50,yb=228,ht=190,max=scale*steps,Y=v=>yb-v/max*ht;
  for(let s=0;s<=steps;s++){const y=Y(s*scale);rect(x0,y,250,1,C.grid);line([x0-5,y],[x0,y],C.fg,2);text(String(s*scale),x0-10,y,12,C.muted,600,'right');}
  line([x0,yb-ht-8],[x0,yb],C.fg,2.5);line([x0,yb],[300,yb],C.fg,2.5);
  cats.forEach((c,i)=>{const x=x0+16+i*60;rrect(x,Y(vals[i]),40,yb-Y(vals[i]),4,o.hl&&o.hl.includes(i)?'rgba(245,196,81,.75)':'rgba(91,155,255,.6)');text(c,x+20,yb+14,12,C.fg,600);
    if(o.read&&o.read.includes(i)){line([x0,Y(vals[i])],[x,Y(vals[i])],C.gold,2,true);text(String(vals[i]),x+20,Y(vals[i])-10,14,C.gold,700);}});}

function arr(r,c,o){o=o||{};const sp=Math.min(240/c,170/r,30),x0=160-(c-1)*sp/2,y0=115-(r-1)*sp/2;for(let i=0;i<r;i++){for(let j=0;j<c;j++)dot(x0+j*sp,y0+i*sp,sp*.32,o.rows!=null&&i<o.rows?C.gold:o.grp&&Math.floor(j/(c/o.grp))%2?'#5b9bff':'#f5c451aa');if(o.rows!=null&&i<o.rows)text(String((i+1)*c),x0+(c-1)*sp+sp*.9,y0+i*sp,12,C.gold,700,'left');}}
function groups(n,g,k,o){o=o||{};const per=Math.floor(n/g),rem=n-per*g,cols=Math.min(g,4),rows=Math.ceil(g/cols),W=280/cols,H=Math.min(80,(rem?170:200)/rows);
  for(let i=0;i<g;i++){const cx=20+W*(i%cols)+W/2,cy=40+H*Math.floor(i/cols)+H/2;rrect(cx-W/2+6,cy-H/2+4,W-12,H-8,12,null,i<(k||0)?C.gold:C.edge,i<(k||0)?2.5:1.5);
    if(i<(k||0)||o.all){for(let j=0;j<per;j++){const pc=Math.min(per,5);dot(cx-(pc-1)*7+(j%5)*14,cy-(Math.ceil(per/5)-1)*7+Math.floor(j/5)*14,5.5,C.gold);}text(String(per),cx+W/2-16,cy-H/2+16,12,C.gold,700);}}

     q.options=[{label:'Yes<small>close to the estimate</small>',value:'yes'},{label:'No<small>too far from the estimate</small>',value:'no'}];q.say=v=>v;q.explain=`Estimate: ${fmt(ra)} ${op} ${fmt(rb)} = ${fmt(est)}. ${q.answer==='yes'?fmt(s2)+' is close, so it is sensible.':fmt(s2)+' is too far away, so it is not sensible.'}`;}
   q.draw=()=>{text(`${fmt(a)} ${op} ${fmt(b)}`,160,70,30,C.fg,700);if(q.k){text(`${fmt(a)} → ${fmt(ra)}`,100,130,17,C.gold,700);text(`${fmt(b)} → ${fmt(rb)}`,220,130,17,C.gold,700);text(`≈ ${fmt(ra)} ${op} ${fmt(rb)} = ${fmt(est)}`,160,184,20,C.ok,700);}else text('round, then calculate',160,130,14,C.muted,600);};
   q.reveal=async()=>{q.k=1;sStep(1);await sleep(1100);};return q;}},
 combos:{name:'Combination Maker',unit:'Multiplication and division',make(r){const q={cols:2},c=pick(CTX3),A=between(2,r<=4?3:4),Bn=between(2,r<=4?3:4),N=A*Bn,rev=r>=7;
   if(!rev){q.prompt=`<span>There are <b>${A} ${c[0]}</b> and <b>${Bn} ${c[1]}</b>.</span><span>How many different ${c[4]} can you make?</span><span class="note">Match each one on the left with every one on the right.</span>`;q.answer=N;q.options=opts(N,[A+Bn,N+A,N-Bn,N+1]);q.explain=`Each of the ${A} goes with ${Bn}: ${A} × ${Bn} = ${N}.`;}
   else{q.prompt=`<span>You can make <b>${N} ${c[4]}</b> from <b>${A} ${c[0]}</b>.</span><span>How many ${c[1]} are there?</span>`;q.answer=Bn;q.options=opts(Bn,[N-A,Bn+1,Bn-1,A]);q.explain=`${A} × ? = ${N}. ${N} ÷ ${A} = ${Bn}.`;}
   q.say=fmt;
   q.draw=t=>{const LY=i=>130-(A-1)*26+i*52,RY=j=>130-(Bn-1)*26+j*52;let k=0;
     if(q.k)for(let i=0;i<A;i++)for(let j=0;j<Bn;j++){k++;if(k<=q.k)line([92,LY(i)],[228,RY(j)],C.gold,2);}
     for(let i=0;i<A;i++){rrect(40,LY(i)-18,52,36,8,c[2],C.stage,2);text(String.fromCharCode(65+i),66,LY(i)+1,16,'#14213d',700);}
     for(let j=0;j<Bn;j++){rrect(228,RY(j)-18,52,36,8,rev&&!q.k?'rgba(230,237,247,.10)':c[3],C.stage,2);text(rev&&!q.k?'?':String(j+1),254,RY(j)+1,16,rev&&!q.k?C.muted:'#14213d',700);}
     if(q.k)text(Math.min(q.k,N)+' '+c[4],160,262,18,C.ok,700);};
   q.reveal=async()=>{for(let i=1;i<=N;i++){q.k=i;if(i%2)sStep(i);await sleep(Math.max(120,900/N));}await sleep(500);};return q;}},
 tables:{name:'Table Reader',unit:'Statistics',make(r){const q={cols:2},T=pick(TBL),cats=T[1].slice(0,r<=3?3:4),cl=['3A','3B'],v=cats.map(()=>[between(2,15),between(2,15)]);
   const ci=rnd(cats.length),k=rnd(2);let hl=[],ans,kind=r<=3?'read':r<=6?pick(['row','col']):'diff';
   if(kind==='diff'){while(v[ci][0]===v[ci][1])v[ci][1]=between(2,15);}
   if(kind==='read'){ans=v[ci][k];q.prompt=`<span>How many children in <b>${cl[k]}</b> chose <b>${cats[ci]}</b>?</span><span class="note">Find the row, then the column.</span>`;hl=[[ci,k]];q.explain=`Read across the ${cats[ci]} row to the ${cl[k]} column: ${ans}.`;}
   else if(kind==='row'){ans=v[ci][0]+v[ci][1];q.prompt=`<span>How many children chose <b>${cats[ci]}</b> altogether?</span><span class="note">Add both classes.</span>`;hl=[[ci,0],[ci,1]];q.explain=`${v[ci][0]} + ${v[ci][1]} = ${ans}.`;}
   else if(kind==='col'){ans=v.reduce((s,x)=>s+x[k],0);q.prompt=`<span>How many children are in <b>${cl[k]}</b> altogether?</span><span class="note">Add the whole column.</span>`;hl=cats.map((_,i)=>[i,k]);q.explain=`${v.map(x=>x[k]).join(' + ')} = ${ans}.`;}
   else{const big=v[ci][0]>v[ci][1]?0:1;ans=Math.abs(v[ci][0]-v[ci][1]);q.prompt=`<span>How many more children in <b>${cl[big]}</b> than <b>${cl[1-big]}</b> chose <b>${cats[ci]}</b>?</span>`;hl=[[ci,0],[ci,1]];q.explain=`${v[ci][big]} − ${v[ci][1-big]} = ${ans}.`;}
   q.answer=ans;q.options=opts(ans,[ans+1,ans-1,ans+2,kind==='diff'?v[ci][0]+v[ci][1]:ans+10]);q.say=fmt;
   q.draw=()=>{const x0=30,w=[120,65,65],rh=Math.min(36,180/(cats.length+1)),y0=48;text(T[0],160,30,14,C.muted,600);
     for(let i=0;i<=cats.length;i++)for(let j=0;j<3;j++){const x=x0+(j?w[0]+(j-1)*w[1]:0),y=y0+i*rh,on=i>0&&j>0&&q.k&&hl.some(h=>h[0]===i-1&&h[1]===j-1);
       rrect(x,y,w[j],rh,0,i===0?'rgba(91,155,255,.25)':on?'rgba(245,196,81,.55)':'rgba(230,237,247,.05)',C.edge,1.5);
       text(i===0?(j?cl[j-1]:''):(j?String(v[i-1][j-1]):cats[i-1]),x+w[j]/2,y+rh/2+1,i===0?14:15,on?'#14213d':C.fg,i===0||j?700:500);}
     if(q.k)text('= '+ans,160,y0+(cats.length+1)*rh+30,22,C.ok,700);};
   q.reveal=async()=>{q.k=1;sStep(1);await sleep(1100);};return q;}}
};
const NQ3_TEACH={
 numwords:[{title:'Tens and ones in words',text:'Say the <b>tens</b>, then the <b>ones</b>. Join them with a hyphen: 42 is <b>forty-two</b>.',draw:t=>{pvChart(42,30,60,260,{vals:countUp(t,3,800)});caption('forty-two');}},
  {title:'Hundreds in words',text:'Say the <b>hundreds</b>, then <b>and</b>, then the tens and ones. 342 is <b>three hundred and forty-two</b>.',draw:t=>{pvChart(342,30,60,260,{vals:countUp(t,3,800)});caption('three hundred and forty-two');}},
  {title:'Zero holds the place',text:'Six hundred and five has <b>no tens</b>, so we write a 0 in the tens place: <b>605</b>.',draw:t=>{pvChart(605,30,60,260,{hl:1});caption('six hundred and five = 605');}}],
 estimate:[{title:'What is an estimate?',text:'An <b>estimate</b> is a sensible guess. Round the numbers so they are easy to add.',draw:t=>{text('412 + 289',160,80,30,C.fg,700);if(countUp(t,2,900)>=1){text('412 → 400',100,140,17,C.gold,700);text('289 → 300',220,140,17,C.gold,700);}if(countUp(t,2,900)>=2)text('≈ 700',160,200,24,C.ok,700);}},
  {title:'Round, then calculate',text:'Round to the nearest <b>100</b> for 3-digit numbers, or the nearest <b>10</b> for 2-digit numbers. 598 − 207 ≈ 600 − 200 = <b>400</b>.',draw:t=>{text('598 − 207',160,80,30,C.fg,700);text('≈ 600 − 200 = 400',160,160,20,C.ok,700);}},
  {title:'Is it sensible?',text:'Compare the answer with your estimate. If it is a long way off, check it again.',draw:t=>{text('312 + 289 = 901 ?',160,80,24,C.fg,700);text('estimate: 300 + 300 = 600',160,140,16,C.gold,700);text('901 is not sensible',160,196,18,C.warn,700);}}],
 combos:[{title:'Making combinations',text:'2 tops and 3 pairs of shorts. Each top can go with <b>every</b> pair of shorts.',draw:t=>{const k=countUp(t,6,500);for(let i=0;i<2;i++)for(let j=0;j<3;j++){if(i*3+j<k)line([92,104+i*52],[228,78+j*52],C.gold,2);}for(let i=0;i<2;i++)rrect(40,86+i*52,52,36,8,'#e0485f');for(let j=0;j<3;j++)rrect(228,60+j*52,52,36,8,'#2f6fdf');caption(k+' outfits');}},
  {title:'Work systematically',text:'Go in order: top A with each pair, then top B with each pair. Then you will not miss any or count any twice.',draw:t=>{['A1','A2','A3','B1','B2','B3'].slice(0,countUp(t,6,500)).forEach((s,i)=>text(s,60+(i%3)*100,100+Math.floor(i/3)*50,22,C.gold,700));}},
  {title:'Multiply to find them all',text:'2 tops × 3 shorts = <b>6</b> outfits. Multiply the two numbers.',draw:t=>{text('2 × 3 = 6',160,130,34,C.ok,700);}}],
 tables:[{title:'Rows and columns',text:'A <b>table</b> has rows that go across and columns that go down. The top row tells you what each column means.',draw:t=>{const k=Math.floor(t/1200)%2;for(let i=0;i<4;i++)for(let j=0;j<3;j++)rrect(30+(j?120+(j-1)*65:0),50+i*36,j?65:120,36,0,i===0?'rgba(91,155,255,.25)':(k?j===1:i===2)?'rgba(245,196,81,.5)':'rgba(230,237,247,.05)',C.edge,1.5);caption(k?'a column goes down':'a row goes across');}},
  {title:'Find where they meet',text:'Find the <b>row</b>, then the <b>column</b>. The answer is in the box where they meet.',draw:t=>{const v=[['','3A','3B'],['apple','8','5'],['banana','12','9'],['grapes','4','7']];v.forEach((r,i)=>r.forEach((s,j)=>{rrect(30+(j?120+(j-1)*65:0),50+i*36,j?65:120,36,0,i===0?'rgba(91,155,255,.25)':i===2&&j===2?'rgba(245,196,81,.6)':'rgba(230,237,247,.05)',C.edge,1.5);text(s,30+(j?120+(j-1)*65+32:60),68+i*36,15,i===2&&j===2?'#14213d':C.fg,700);}));caption('banana, 3B = 9');}},
  {title:'Two-step questions',text:'Some questions need two steps: <b>find</b> the numbers, then <b>add</b> or <b>subtract</b>. 12 + 9 = 21 chose banana.',draw:t=>{text('12 + 9 = 21',160,120,30,C.ok,700);text('12 − 9 = 3 more in 3A',160,180,18,C.gold,700);}}]
};
Object.assign(GAMES,NQ3_GAMES);Object.assign(TEACH,NQ3_TEACH);

/*</NQ3>*/
/* ---------- learn first engine ---------- */
function speak(s){try{const u=new SpeechSynthesisUtterance((s.title+'. '+s.text).replace(/<[^>]+>/g,'').replace(/&gt;/g,'greater than').replace(/&lt;/g,'less than'));u.lang='en-GB';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function startTeach(kind){st.mode='teach';st.kind=kind;st.ti=0;st.locked=false;showTeach();}
function showTeach(){const L=TEACH[st.kind],s=L[st.ti],last=st.ti===L.length-1;st.t0=performance.now();
  setHud('Learn first',GAMES[st.kind].name+' · '+(st.ti+1)+' / '+L.length);setPrompt(`<span class="big">${s.title}</span><span>${s.text}</span>`);
  setButtons([{label:st.ti?'Back':'Skip to game',value:'back'},{label:'Read to me',value:'read'},{label:last?'Start the game':'Next',value:'next',cls:last?'run':''}],v=>{
    if(v==='read')return speak(s);if(v==='back'){if(st.ti){st.ti--;showTeach();}else startQuiz(st.kind);return;}if(last)startQuiz(st.kind);else{st.ti++;showTeach();}},3);}

/* ---------- quiz engine ---------- */
function startQuiz(kind){try{speechSynthesis.cancel();}catch(e){}st.kind=kind;st.round=0;st.score=0;st.hearts=3;nextQ();}
function quizHud(){setHud(pips(st.hearts),`Question ${st.round} / 8 · Score ${st.score}`);}
function nextQ(){if(st.round>=8||st.hearts<=0)return endQuiz();st.round++;st.mode='quiz';st.q=GAMES[st.kind].make(st.round);st.locked=false;quizHud();setPrompt(st.q.prompt);setButtons(st.q.options,answer,st.q.cols||2);}
async function answer(v){if(st.locked)return;st.locked=true;const q=st.q,ok=v===q.answer;st.btns.forEach(b=>{if(b.dataset.v===String(v))b.classList.add('sel');});
  setPrompt(q.prompt+'<span class="note">Watch…</span>');await q.reveal();
  if(ok){st.score++;sGood();setPrompt(`<span class="big good">Correct</span><span>${q.explain}</span>`);}else{st.hearts--;sBad();shake();setPrompt(`<span class="big bad">Not quite</span><span>The answer is <b>${q.say(q.answer)}</b>. ${q.explain}</span>`);}
  quizHud();setButtons([{label:st.round>=8||st.hearts<=0?'See my score':'Next question',value:'n',cls:'run wide'}],()=>nextQ(),1);}
function endQuiz(){st.mode='over';st.stars=st.score>=7?3:st.score>=5?2:st.score>=3?1:0;st.overTitle=st.hearts>0?'Round complete':'Out of lives';
  saveBest(st.kind,st.score);if(st.hearts>0)sWin();else sBad();setHud(GAMES[st.kind].name,st.stars+' / 3 stars');
  setPrompt(st.stars===3?'<span class="big good">Brilliant number work</span><span>Try a different game next.</span>':'<span class="big">Keep practising</span><span>Play again to earn more stars. The answers always show you how.</span>');
  setButtons([{label:'Play again',value:'a',cls:'run'},{label:'Learn again',value:'l'},{label:'Menu',value:'m'}],v=>v==='a'?startQuiz(st.kind):v==='l'?startTeach(st.kind):menu(),3);}
function star(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(x+rr*Math.cos(a),y+rr*Math.sin(a));}ctx.closePath();ctx.fill();}
function overScene(){text(st.overTitle,160,50,22,C.fg,600);text('SCORE',160,96,12,C.muted,500);text(st.score+' / 8',160,130,40,C.fg,600);for(let i=0;i<3;i++)star(110+i*50,196,18,i<st.stars?C.gold:C.off);text('Best score: '+best[st.kind]+' / 8',160,254,13,C.muted,500);}

/* ---------- menu ---------- */
function menu(){st.mode='menu';st.locked=false;setHud('Choose a game',Object.keys(GAMES).length+' games');
  setPrompt('<span class="big">Choose a game</span><span>Each game starts with a short lesson. Place value, + and −, × and ÷, and statistics.</span>');
  const b=k=>best[k]!=null?`<small>Best ${best[k]} / 8</small>`:`<small>${GAMES[k].unit}</small>`;
  setButtons(Object.keys(GAMES).map(k=>({label:GAMES[k].name+b(k),value:k})),v=>startTeach(v),2);}
function menuScene(t){pvChart(472,40,24,240,{hl:Math.floor(t/900)%3});const X=NLine(0,100,10,190,[0,50,100]);arrowDown(X(30+Math.round(((Math.sin(t/900)+1)/2)*4)*10),180);text('Place value · + and − · Charts',160,262,14,C.muted,500);}

/* ---------- render ---------- */
function render(t){bg();try{if(st.mode==='menu')menuScene(t);else if(st.mode==='quiz'&&st.q)st.q.draw(t);else if(st.mode==='teach')TEACH[st.kind][st.ti].draw(Math.max(0,t-st.t0));else if(st.mode==='over')overScene();}catch(e){console.error(e);}requestAnimationFrame(render);}
$('btnMenu').addEventListener('click',()=>{if(!st.locked||st.mode==='over'){sClick();menu();}});
$('btnSound').addEventListener('click',()=>{muted=!muted;$('btnSound').textContent=muted?'Sound: off':'Sound: on';if(!muted)sClick();});
document.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft'){move(-1,0);e.preventDefault();}else if(k==='ArrowRight'){move(1,0);e.preventDefault();}else if(k==='ArrowUp'){move(0,-1);e.preventDefault();}else if(k==='ArrowDown'){move(0,1);e.preventDefault();}else if(k==='Escape'){if(!st.locked||st.mode==='over')menu();}});
window.__NQ={GAMES,TEACH,colWork};
(function(){const h=location.hash.slice(1);if(TEACH[h])startTeach(h);else menu();})();
requestAnimationFrame(render);
})();
</script>
