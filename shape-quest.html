<title>Shape Quest Arcade</title>

<style>
*{box-sizing:border-box}
body{margin:0}
/* Layout: the Turn Quest console, reused on purpose: slim header, one stage panel on a blueprint grid, the question beneath, flat control tiles. Single dark theme so every classroom screen matches. Line colours follow the unit's code: horizontal red, vertical blue, diagonal green. */
:root{
  --bg:#0d1524; --panel:#141f33; --stage:#111b2d; --tile:#1b2840; --tile-hi:#22324d; --edge:#2b3b57;
  --fg:#e6edf7; --muted:#9aaac2; --faint:#6b7a93;
  --h:#ff6b81; --v:#5b9bff; --d:#3dd68c;
  --ok:#3dd68c; --ok-ink:#07210f; --gold:#f5c451; --warn:#ff8a3d; --life:#ff5d73;
  --font:'Lexend', 'Segoe UI', Verdana, sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font); font-size:17px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 40px;
}
.wrap{max-width:540px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
.topbar{display:flex; align-items:center; gap:10px}
.logo{flex:1; min-width:0; margin:0; display:flex; flex-direction:column; gap:2px}
.logo b{font-size:20px; font-weight:700; letter-spacing:.18em}
.logo span{font-size:12px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.pill{font:500 14px var(--font); color:var(--fg); background:var(--tile); border:1px solid var(--edge); border-radius:10px; padding:9px 14px; cursor:pointer}
.pill:hover{background:var(--tile-hi)}
.panel{background:var(--panel); border:1px solid var(--edge); border-radius:18px; overflow:hidden}
.hud{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 16px; font-size:14px; font-weight:500; color:var(--muted); font-variant-numeric:tabular-nums}
.hud .lives{display:flex; align-items:center; gap:6px; text-transform:uppercase; letter-spacing:.12em; font-size:12px}
.hud .pip{width:10px; height:10px; border-radius:50%; background:var(--life)}
.hud .pip.off{background:transparent; box-shadow:inset 0 0 0 2px var(--edge)}
.hud .r{color:var(--fg)}
.stage{background:var(--stage); border-block:1px solid var(--edge)}
canvas{display:block; width:100%; height:auto; aspect-ratio:320/288; max-width:100%; touch-action:manipulation}
canvas.tap{cursor:pointer}
.prompt{min-height:8em; padding:16px 18px 18px; font-size:19px; line-height:1.5; display:flex; flex-direction:column; gap:6px}
.prompt b{font-weight:600; color:var(--fg)}
.prompt .big{font-size:22px; font-weight:600; letter-spacing:.01em}
.prompt .big.good{color:var(--ok)}
.prompt .big.bad{color:var(--warn)}
.prompt .note{color:var(--muted); font-size:16px}
.chip{display:inline-block; padding:0 9px; border-radius:7px; font-weight:600; font-size:.92em}
.chip.h{color:var(--h); background:rgba(255,107,129,.13); border:1px solid rgba(255,107,129,.55)}
.chip.v{color:var(--v); background:rgba(91,155,255,.14); border:1px solid rgba(91,155,255,.55)}
.chip.d{color:var(--d); background:rgba(61,214,140,.12); border:1px solid rgba(61,214,140,.5)}
.chip.g{color:var(--gold); background:rgba(245,196,81,.12); border:1px solid rgba(245,196,81,.5)}
.facts{display:flex; flex-wrap:wrap; gap:6px}
.facts span{background:var(--tile); border:1px solid var(--edge); padding:2px 10px; font-size:15px; font-weight:500; border-radius:8px}
.panel.shake canvas{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.answers{display:grid; grid-template-columns:repeat(var(--cols,2), minmax(0,1fr)); gap:10px}
.key{
  font:500 18px/1.2 var(--font); color:var(--fg); background:var(--tile);
  border:1px solid var(--edge); border-radius:14px; padding:12px 10px; min-height:62px;
  cursor:pointer; text-wrap:balance; transition:background .12s, border-color .12s, transform .08s;
}
.key small{display:block; font-size:13px; font-weight:400; color:var(--muted); margin-top:3px}
.key:hover{background:var(--tile-hi)}
.key:active{transform:scale(.98)}
.key.sel{border-color:var(--v)}
.key.run{background:var(--ok); border-color:var(--ok); color:var(--ok-ink); font-weight:600}
.key.run small{color:var(--ok-ink); opacity:.75}
.key.wide{grid-column:1 / -1}
button:focus-visible{outline:2px solid var(--v); outline-offset:2px}
@media (prefers-reduced-motion: reduce){ .panel.shake canvas{animation:none} .key{transition:none} }
@media (max-width:400px){ .key{font-size:16px} .prompt{font-size:17px} }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <h1 class="logo"><b>SHAPE QUEST</b><span>Lines, 2D, 3D and nets · Year 3</span></h1>
    <button class="pill" id="btnSound" type="button">Sound: on</button>
    <button class="pill" id="btnMenu" type="button">Menu</button>
  </div>
  <div class="panel" id="card">
    <div class="hud" id="hud"></div>
    <div class="stage"><canvas id="cv" width="640" height="576" aria-label="Game picture"></canvas></div>
    <div class="prompt" id="prompt" aria-live="polite"></div>
  </div>
  <div class="answers" id="answers"></div>
</div>

<style id="a11y-css">
body.big .prompt{font-size:23px;line-height:1.55}
body.big .prompt .big{font-size:27px}
body.big .key{font-size:20px;min-height:64px}
body.big .hud{font-size:16px}

.a11y-panel{position:fixed;z-index:30;top:60px;right:12px;width:min(320px,calc(100vw - 24px));background:#16233a;border:1px solid #2b3b57;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.4);font-size:16px}
.a11y-panel[hidden]{display:none}
.a11y-panel h2{margin:0;font-size:17px}
.a11y-panel label{display:flex;gap:10px;align-items:center;cursor:pointer;min-height:40px}
.a11y-panel input{width:22px;height:22px;accent-color:#f5c451}
.topbar{flex-wrap:wrap;row-gap:8px}
.topbar .logo{flex:1 1 230px;min-width:200px}
.topbar .logo b{white-space:nowrap}
</style>
<script id="mh-voice">/* Maths Hub voice: picks the most natural English voice on this device and applies the reader's settings */
(function(){var ss=window.speechSynthesis;if(!ss||ss.__mh)return;ss.__mh=1;var orig=ss.speak.bind(ss);
function A(){try{return JSON.parse(localStorage.getItem('mh-a11y')||'{}')||{};}catch(e){return {};}}
var BAD=/compact|espeak|robot|novelty|bad news|bells|whisper|zarvox|trinoids|albert|jester|organ|cellos|bubbles|boing|deranged|hysterical|superstar|wobble|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley|good news|junior|ralph|fred|kathy|vicki|victoria/;
function rank(v){var n=v.name.toLowerCase(),l=(v.lang||'').toLowerCase().replace('_','-'),s=0;if(l.indexOf('en')!==0)return -1;
  if(l==='en-gb')s+=30;else if(l==='en-ie'||l==='en-au'||l==='en-nz')s+=16;else s+=10;
  if(/natural|neural/.test(n))s+=45;if(/online/.test(n))s+=8;if(/premium/.test(n))s+=42;if(/enhanced/.test(n))s+=36;if(/siri/.test(n))s+=30;
  if(/google uk english female/.test(n))s+=26;else if(/google uk english/.test(n))s+=22;else if(/google/.test(n))s+=12;
  if(/sonia|libby|maisie|abbi|bella|hollie|olivia|serena|kate|stephanie|martha|daniel|arthur|oliver|jamie/.test(n))s+=12;
  if(BAD.test(n))s-=80;return s;}
function list(){return ss.getVoices().filter(function(v){return rank(v)>=0;}).sort(function(a,b){return rank(b)-rank(a);});}
function best(){var a=A(),vs=ss.getVoices();if(a.voice){var f=vs.filter(function(v){return v.name===a.voice;})[0];if(f)return f;}return list()[0]||null;}
ss.speak=function(u){try{var v=best();if(v){u.voice=v;u.lang=v.lang;}var a=A();u.rate=a.slow?0.8:0.97;u.pitch=1;
  if(u.text)u.text=u.text.replace(/\s*\n+\s*/g,'. ').replace(/\s{2,}/g,' ');}catch(e){}return orig(u);};
window.MH_VOICES=list;window.MH_VOICE_RANK=rank;
try{ss.getVoices();if(typeof ss.addEventListener==='function')ss.addEventListener('voiceschanged',function(){});}catch(e){}
})();
</script>
<script>
function speakable(t){
  var D={2:['half','halves'],3:['third','thirds'],4:['quarter','quarters'],5:['fifth','fifths'],6:['sixth','sixths'],7:['seventh','sevenths'],8:['eighth','eighths'],9:['ninth','ninths'],10:['tenth','tenths'],12:['twelfth','twelfths'],100:['hundredth','hundredths']};
  var N=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
  t=String(t).replace(/½/g,' 1/2').replace(/¼/g,' 1/4').replace(/¾/g,' 3/4').replace(/\s+/g,' ').trim();
  t=t.replace(/(\d)\s?mm\b/g,'$1 millimetres').replace(/(\d)\s?cm\b/g,'$1 centimetres').replace(/(\d)\s?km\b/g,'$1 kilometres').replace(/(\d)\s?kg\b/g,'$1 kilograms').replace(/(\d)\s?ml\b/g,'$1 millilitres').replace(/(\d)\s?g\b/g,'$1 grams').replace(/(\d)\s?l\b/g,'$1 litres').replace(/(\d)\s?m\b/g,'$1 metres').replace(/(\d)p\b/g,'$1 pence');
  t=t.replace(/(^|[^\d\/])(\d{1,2})\/(\d{1,3})(?![\d\/])/g,function(m,p,a,b){a=+a;b=+b;var w=D[b]?(N[a]||a)+' '+D[b][a===1?0:1]:a+' over '+b;if(a===b&&b>1)w+=', one whole';return p+w;});
  t=t.replace(/_{2,}|☐/g,' blank ');
  t=t.replace(/(^|[\s(=+\-−×÷])\?(?=\s*[+\-−×÷=])/g,'$1 what number ').replace(/([=+\-−×÷]\s*)\?/g,'$1 what number');
  t=t.replace(/=\s*$/,' equals what?').replace(/…\s*$/,' what?').replace(/…/g,', ');
  t=t.replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/−/g,' minus ').replace(/\s\+\s|\+/g,' plus ').replace(/=/g,' equals ').replace(/\s<\s/g,' is less than ').replace(/\s>\s/g,' is greater than ');
  t=t.replace(/(^|[^\d,.\/])1 (millimetre|centimetre|kilometre|kilogram|millilitre|gram|litre|metre)s\b/g,'$1one $2').replace(/(half|quarter|third|fifth|tenth) (millimetre|centimetre|kilometre|kilogram|millilitre|gram|litre|metre)s\b/g,'$1 a $2').replace(/\bone half a /g,'half a ').replace(/\bone (quarter|third|fifth|tenth) a /g,'a $1 of a ');
  t=t.replace(/[↻↺→←↑↓✓✗★☆♥]/g,'').replace(/\s+/g,' ').trim();
  return t;
}

(function(){
  var A={};try{A=JSON.parse(localStorage.getItem('mh-a11y')||'{}')||{};}catch(e){}
  window.A11Y=A;
  if(A.low)A.still=true;if(A.still){var mm=window.matchMedia;window.matchMedia=function(q){if(/prefers-reduced-motion/.test(q))return {matches:true,media:q,addListener:function(){},removeListener:function(){},addEventListener:function(){},removeEventListener:function(){}};return mm.call(window,q);};}
  try{if(window.speechSynthesis){var sp=speechSynthesis.speak.bind(speechSynthesis);speechSynthesis.speak=function(u){if(A.slow)u.rate=Math.min(u.rate||1,.7);return sp(u);};}}catch(e){}
  var SKIP=/^(Next|Back|Skip to game|Read to me|Menu|Play again|Learn again|Start|Play|Read aloud)\b/i;
  function textOf(el){var c=el.cloneNode(true);c.querySelectorAll('.fr').forEach(function(f){var b=f.querySelector('b'),i=f.querySelector('i');f.textContent=' '+(b?b.textContent:'')+'/'+(i?i.textContent:'')+' ';});c.querySelectorAll('small').forEach(function(s){s.textContent=', '+s.textContent;});c.querySelectorAll('span,b,div').forEach(function(s){s.insertAdjacentText('afterend',' ');});return c.textContent.replace(/\s+/g,' ').trim();}
  function promptText(p){return [].slice.call(p.children).map(function(c){var x=textOf(c);return x&&!/[.?!:]$/.test(x)?x+'.':x;}).join(' ')||textOf(p);}
  function tidy(x){return x.replace(/equals\s*\./g,'equals what?').replace(/\s+([.,?!])/g,'$1').replace(/([?!.])\.+/g,'$1').replace(/\s+/g,' ').trim();}
  function readNow(){var p=document.getElementById('prompt'),a=document.getElementById('answers');if(!p)return;
    var t=promptText(p),opts=[].slice.call(a?a.querySelectorAll('button'):[]).map(textOf).filter(function(x){return x&&!SKIP.test(x);});
    if(/^Choose a game/.test(t))opts=[];
    var s=tidy(speakable(t)+(opts.length&&opts.length<=8?' Is it '+opts.map(speakable).join(', or ')+'?':''));
    try{var u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
  window.A11Y.read=readNow;
  function save(){try{localStorage.setItem('mh-a11y',JSON.stringify({big:A.big,slow:A.slow,still:A.still,auto:A.auto}));}catch(e){}}
  document.addEventListener('DOMContentLoaded',function(){
    document.body.classList.toggle('big',!!A.big);document.body.classList.toggle('still',!!A.still);
    var bar=document.querySelector('.topbar'),menu=document.getElementById('btnMenu');if(!bar)return;
    var rb=document.createElement('button');rb.className='pill a11y-read';rb.type='button';rb.id='btnRead';rb.textContent='Read aloud';rb.onclick=readNow;
    var sb=document.createElement('button');sb.className='pill';sb.type='button';sb.id='btnA11y';sb.textContent='Settings';sb.setAttribute('aria-expanded','false');
    bar.insertBefore(rb,bar.querySelector('.pill'));bar.insertBefore(sb,menu);
    var pn=document.createElement('div');pn.className='a11y-panel';pn.hidden=true;pn.setAttribute('role','dialog');pn.setAttribute('aria-label','Settings');
    var opts=[['big','Bigger text'],['slow','Slower speech'],['still','Less movement'],['auto','Read each question out automatically']];
    pn.innerHTML='<h2>Settings</h2>'+opts.map(function(o){return '<label><input type="checkbox" data-k="'+o[0]+'"'+(A[o[0]]?' checked':'')+'> '+o[1]+'</label>';}).join('')+'<button class="pill" type="button" id="a11yDone">Done</button>';
    document.body.appendChild(pn);
    sb.onclick=function(){pn.hidden=!pn.hidden;sb.setAttribute('aria-expanded',String(!pn.hidden));};
    pn.querySelector('#a11yDone').onclick=function(){pn.hidden=true;sb.setAttribute('aria-expanded','false');};
    pn.querySelectorAll('input').forEach(function(c){c.onchange=function(){A[c.dataset.k]=c.checked;save();
      if(c.dataset.k==='big')document.body.classList.toggle('big',c.checked);
      if(c.dataset.k==='still'){document.body.classList.toggle('still',c.checked);}};});
    var p=document.getElementById('prompt'),tm;
    if(p)new MutationObserver(function(){if(!A.auto)return;clearTimeout(tm);tm=setTimeout(function(){if(!/^Choose a game/.test(p.textContent.trim()))readNow();},350);}).observe(p,{childList:true,subtree:true,characterData:true});
  });
})();
</script>
<script>
(function(){
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d'); ctx.setTransform(2,0,0,2,0,0);
const C={fg:'#e6edf7',muted:'#9aaac2',faint:'#6b7a93',stage:'#111b2d',grid:'#1a2740',edge:'#2b3b57',gold:'#f5c451',ok:'#3dd68c',warn:'#ff8a3d',
  h:'#ff6b81',v:'#5b9bff',d:'#3dd68c',off:'#2b3b57',board:'#18243a',pin:'#9aaac2'};
const FACE_COL=['#f5c451','#5b9bff','#3dd68c','#ff6b81','#b39ddb','#ff8a3d'];
const PAIR_COL=['#f5c451','#5b9bff','#3dd68c','#b39ddb'];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const promptEl=$('prompt'), hudEl=$('hud'), answersEl=$('answers'), cardEl=$('card');
const sleep=ms=>new Promise(r=>setTimeout(r,reduce?Math.min(ms,150):ms));
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const R=d=>d*Math.PI/180;

/* ---------- vectors ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], add=(a,b)=>[a[0]+b[0],a[1]+b[1]], mul=(a,k)=>[a[0]*k,a[1]*k];
const dot2=(a,b)=>a[0]*b[0]+a[1]*b[1], cross2=(a,b)=>a[0]*b[1]-a[1]*b[0], len=a=>Math.hypot(a[0],a[1]);
const norm=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l];};
const rot=(p,a)=>[p[0]*Math.cos(a)-p[1]*Math.sin(a),p[0]*Math.sin(a)+p[1]*Math.cos(a)];

/* ---------- sound ---------- */
let actx=null, muted=false;
function beep(f,d,vol){ if(muted) return; try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
  o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(vol||.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+(d||.12));
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+(d||.12)+.02);
}catch(e){} }
const tune=n=>n.forEach(([f,t,d])=>setTimeout(()=>beep(f,d||.14),t));
const sGood=()=>tune([[587,0],[880,110,.25]]);
const sBad=()=>tune([[294,0,.2],[220,150,.28]]);
const sClick=()=>beep(1200,.03,.04);
const sWin=()=>tune([[523,0],[659,120],[784,240],[1047,360,.4]]);
const sStep=i=>beep(440+i*70,.09);

/* ---------- storage ---------- */
let best={};
try{ best=JSON.parse(localStorage.getItem('shapequest-best')||'{}')||{}; }catch(e){ best={}; }
function saveBest(k,v){ if(!(best[k]>=v)){ best[k]=v; try{ localStorage.setItem('shapequest-best',JSON.stringify(best)); }catch(e){} } }

/* ---------- drawing helpers ---------- */
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function rrect(x,y,w,h,r,fill,stroke,lw){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||2;ctx.stroke();}}
function text(s,x,y,size,c,weight,align){ctx.fillStyle=c||C.fg;ctx.font=(weight||500)+' '+size+'px Lexend, sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function line(a,b,c,w,dash){ctx.strokeStyle=c;ctx.lineWidth=w||3;ctx.lineCap='round';ctx.setLineDash(dash?[6,6]:[]);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.setLineDash([]);}
function poly(P,fill,stroke,lw,dash){ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||3;ctx.lineJoin='round';ctx.setLineDash(dash?[6,6]:[]);ctx.stroke();ctx.setLineDash([]);}}
function dot(p,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(p[0],p[1],r,0,Math.PI*2);ctx.fill();}
function badge(p,s,c){dot(p,11,c||C.gold);text(String(s),p[0],p[1]+1,12,C.stage,700);}
function bg(){
  rect(0,0,320,288,C.stage); ctx.strokeStyle=C.grid; ctx.lineWidth=1;
  for(let x=16;x<320;x+=24){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,288);ctx.stroke();}
  for(let y=12;y<288;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(320,y);ctx.stroke();}
}
function raMark(V,A,B,c,s){const u=norm(sub(A,V)),w=norm(sub(B,V));s=s||11;ctx.strokeStyle=c||C.gold;ctx.lineWidth=2.5;ctx.lineJoin='miter';ctx.beginPath();

function segX(p1,p2,p3,p4){const o=(a,b,c)=>Math.sign(cross2(sub(b,a),sub(c,a)));const on=(a,b,c)=>Math.min(a[0],b[0])<=c[0]&&c[0]<=Math.max(a[0],b[0])&&Math.min(a[1],b[1])<=c[1]&&c[1]<=Math.max(a[1],b[1]);
  const d1=o(p3,p4,p1),d2=o(p3,p4,p2),d3=o(p1,p2,p3),d4=o(p1,p2,p4);
  if(d1!==d2&&d3!==d4&&d1&&d2&&d3&&d4)return true;
  return (!d1&&on(p3,p4,p1))||(!d2&&on(p3,p4,p2))||(!d3&&on(p1,p2,p3))||(!d4&&on(p1,p2,p4));}
function simplify(P){let A=P.slice(),ch=true;while(ch&&A.length>2){ch=false;for(let i=0;i<A.length;i++){const a=A[(i-1+A.length)%A.length],v=A[i],b=A[(i+1)%A.length];if(cross2(sub(v,a),sub(b,v))===0){A.splice(i,1);ch=true;break;}}}return A;}

function pinPrompt(msg){ setPrompt(`<span class="big">${PIN_LEVELS[st.lv].task}</span><span class="note">${msg||'Tap the pins to stretch the band. Tap your first pin again to close the shape, then press <b>Check</b>.'}</span>`); }
function pinUI(){ pinPrompt(); setButtons([{label:'Undo',value:'U'},{label:'Clear',value:'X'},{label:'Check',value:'C',cls:'run'}],pinKey,3); }
function pinKey(v){ if(st.locked) return; const pn=st.pin;
  if(v==='U'){ if(pn.closed){pn.closed=false;pn.res=null;} else pn.pts.pop(); pinPrompt(); }
  else if(v==='X'){ pn.pts=[]; pn.closed=false; pn.res=null; pinPrompt(); }

function tapPin(e){ if(st.mode!=='pin'||st.locked) return; const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)*320/r.width, y=(e.clientY-r.top)*288/r.height;

  if(!bestPin) return; const pn=st.pin;

  const at=pn.pts.findIndex(p=>p[0]===bestPin[0]&&p[1]===bestPin[1]);
  if(at===0&&pn.pts.length>=3){ pn.closed=true; beep(880,.08); pinPrompt('Shape closed. Press <b>Check</b>.'); return; }

function checkPin(){
  const pn=st.pin;

  pn.closed=true; const P=simplify(pn.pts);
  if(P.length<3){ pn.res=null; pinPrompt('All your pins are in one straight line. Spread them out!'); sBad(); shake(); return; }
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){ if(Math.abs(i-j)===1||(i===0&&j===P.length-1)) continue;
    if(segX(P[i],P[(i+1)%P.length],P[j],P[(j+1)%P.length])){ pn.res=null; pinPrompt('Your band crosses over itself. Press <b>Undo</b> and try a different order.'); sBad(); shake(); return; } }

  setPrompt(`<span class="big">${s.title}</span><span>${s.text}</span>`);
  setButtons([{label:st.ti?'Back':'Skip to game',value:'back'},{label:'Read to me',value:'read'},{label:last?'Start the game':'Next',value:'next',cls:last?'run':''}],v=>{
    if(v==='read') return speak(s);
    if(v==='back'){ if(st.ti){st.ti--;showTeach();} else beginGame(st.kind); return; }
    if(last) beginGame(st.kind); else {st.ti++;showTeach();}
  },3); }
function teachScene(t){ TEACH[st.kind][st.ti].draw(Math.max(0,t-st.t0)); }

const GAMES={
  lines:{name:'Line Spotter',sub:'Horizontal and vertical',make:makeLines},
  para:{name:'Parallel Patrol',sub:'Parallel and perpendicular',make:makePara},
  d2:{name:'2D Detective',sub:'Sides, vertices, right angles',make:make2D},
  d3:{name:'3D Detective',sub:'Faces, edges, vertices',make:make3D},
  pin:{name:'Pinboard Builder',sub:'Stretch the band'},
  nets:{name:'Net Factory',sub:'Fold it up',make:makeNet}
};
/*<SQ2>*/
/* ---------- extra games (SQ2): angles, symmetry ---------- */
const rndb=(a,b)=>a+rnd(b-a+1);
function angleFig(V,base,deg,o){o=o||{};const L=o.len||130,u=[Math.cos(R(base)),-Math.sin(R(base))],w=[Math.cos(R(base+deg)),-Math.sin(R(base+deg))];
  const A=add(V,mul(u,L)),B=add(V,mul(w,L*(o.len2||1)));
  if(o.check){sector(V,u,w,52,'rgba(245,196,81,.30)');}
  ctx.strokeStyle=o.col||C.v;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(V[0],V[1],26,-R(base),-R(base+deg),true);ctx.stroke();
  line(V,A,C.fg,5);line(V,B,C.fg,5);dot(V,5,C.fg);return {A,B,u,w};}
function classify(d){return d<90?'acute':d===90?'right':'obtuse';}
const SYM=[
 ['square',[[-60,-60],[60,-60],[60,60],[-60,60]],[0,45,90,135]],
 ['rectangle',[[-85,-48],[85,-48],[85,48],[-85,48]],[0,90]],
 ['equilateral triangle',[[0,-78],[68,39],[-68,39]],[30,90,150]],
 ['isosceles triangle',[[0,-80],[55,60],[-55,60]],[90]],
 ['kite',[[0,-75],[48,-22],[0,85],[-48,-22]],[90]],
 ['regular hexagon',[0,1,2,3,4,5].map(i=>[75*Math.cos(R(i*60)),75*Math.sin(R(i*60))]),[0,30,60,90,120,150]],
 ['arrow',[[0,-85],[55,-20],[20,-20],[20,75],[-20,75],[-20,-20],[-55,-20]],[90]],
 ['T shape',[[-70,-65],[70,-65],[70,-30],[18,-30],[18,75],[-18,75],[-18,-30],[-70,-30]],[90]],
 ['L shape',[[-45,-75],[-10,-75],[-10,40],[55,40],[55,75],[-45,75]],[]],
 ['parallelogram',[[-80,45],[35,45],[80,-45],[-35,-45]],[]],
 ['scalene triangle',[[-70,55],[75,55],[-25,-65]],[]]
];
const symOf=s=>s[2].length;
function rotP(p,a){const c=Math.cos(R(a)),s=Math.sin(R(a));return [p[0]*c-p[1]*s,p[0]*s+p[1]*c];}
function reflP(p,th){const u=[Math.cos(R(th)),-Math.sin(R(th))],d=2*(p[0]*u[0]+p[1]*u[1]);return [d*u[0]-p[0],d*u[1]-p[1]];}
function axisLine(O,th,col,dash,L){const u=[Math.cos(R(th)),-Math.sin(R(th))];L=L||120;line(add(O,mul(u,-L)),add(O,mul(u,L)),col,3,dash);}
const SQ2_GAMES={
 angles:{name:'Angle Sorter',sub:'Acute, right or obtuse',make(r){r=r||st.round||1;const kind=pick(['acute','right','obtuse']);
   const deg=kind==='right'?90:kind==='acute'?(r<=4?rndb(20,60):rndb(55,82)):(r<=4?rndb(115,165):rndb(98,130)),base=r<=3?0:pick([0,20,45,90,135,160,200,250,300]);
   const V=[160-70*Math.cos(R(base+deg/2)),140+70*Math.sin(R(base+deg/2))];
   const q={answer:kind,cols:3,options:[{label:'Acute<small>less than a right angle</small>',value:'acute'},{label:'Right angle<small>a square corner</small>',value:'right'},{label:'Obtuse<small>more than a right angle</small>',value:'obtuse'}],
     prompt:'<span>What type of angle is this?</span><span class="note">Imagine a square corner in the angle. Is the angle smaller, the same or bigger?</span>',
     say:v=>({acute:'acute',right:'a right angle',obtuse:'obtuse'})[v],
     explain:kind==='right'?'It fits the square corner exactly, so it is a right angle.':kind==='acute'?'It is smaller than the square corner, so it is acute.':'It is bigger than the square corner, so it is obtuse.',
     draw(){angleFig(V,base,deg,{check:q.k});if(q.k){text(kind==='right'?'right angle':kind,160,268,18,C.ok,700);if(kind==='right'){const u=[Math.cos(R(base)),-Math.sin(R(base))],w=[Math.cos(R(base+90)),-Math.sin(R(base+90))];raMark(V,add(V,u),add(V,w),C.gold,16);}}},
     reveal:async()=>{q.k=1;sStep(1);await sleep(1100);}};return q;}},
 symmetry:{name:'Mirror Lines',sub:'Lines of symmetry',make(r){r=r||st.round||1;const S=pick(r<=3?SYM.filter(s=>['square','rectangle','isosceles triangle','kite','arrow','T shape','L shape','parallelogram'].includes(s[0])):SYM);
   const rot=r<=3?0:pick([0,0,15,30,45,90]),P=S[1].map(p=>rotP(p,-rot)),axes=S[2].map(a=>(a+rot)%180),O=[160,135],n=axes.length;
   const q={cols:2};
   if(r<=5){const yes=n>0&&Math.random()<.55;let th;if(yes)th=pick(axes);else{const cand=[0,30,45,60,90,120,135,150].map(a=>(a+rot)%180).filter(a=>!axes.some(b=>Math.abs(((a-b)%180+180)%180)<2||Math.abs(((a-b)%180+180)%180-180)<2));th=pick(cand.length?cand:[(rot+20)%180]);}
     q.answer=yes?'yes':'no';q.options=[{label:'Yes',value:'yes'},{label:'No',value:'no'}];q.say=v=>v;
     q.prompt='<span>Is the dashed line a <b>line of symmetry</b>?</span><span class="note">Would both halves match if you folded along it?</span>';
     q.explain=yes?'Fold along the line and the two halves match exactly.':'Reflect one half across the line: the halves do not match.';
     q.draw=()=>{poly(P.map(p=>add(O,p)),'rgba(91,155,255,.30)',C.fg,3);if(q.k)poly(P.map(p=>add(O,reflP(p,th))),yes?'rgba(61,214,140,.35)':'rgba(255,138,61,.30)',yes?C.ok:C.warn,2.5,!yes);axisLine(O,th,C.gold,true,125);if(q.k)text(yes?'the halves match':'the halves do not match',160,272,15,yes?C.ok:C.warn,700);};}
   else{q.answer=String(n);const pool=[...new Set([n,0,1,2,3,4,6].map(String))].filter(x=>x!==String(n));q.options=shuffle([String(n),...shuffle(pool).slice(0,3)]).map(v=>({label:v,value:v}));q.cols=4;q.say=v=>v;
     q.prompt=`<span>How many <b>lines of symmetry</b> does this ${S[0]} have?</span>`;q.explain=n?`A ${S[0]} has ${n} line${n>1?'s':''} of symmetry.`:`A ${S[0]} has no lines of symmetry. No fold makes the halves match.`;
     q.draw=()=>{poly(P.map(p=>add(O,p)),'rgba(91,155,255,.30)',C.fg,3);if(q.k){axes.slice(0,q.k).forEach(a=>axisLine(O,a,C.gold,true,120));text(n+' line'+(n===1?'':'s')+' of symmetry',160,272,15,C.ok,700);}};}
   q.reveal=async()=>{if(r>5){for(let i=1;i<=Math.max(1,n);i++){q.k=i;sStep(i);await sleep(500);}await sleep(500);}else{q.k=1;sStep(1);await sleep(1200);}};return q;}}
};
const SQ2_TEACH={
 angles:[{title:'Right angles',text:'A <b>right angle</b> is a square corner, a quarter turn. We mark it with a small square.',draw:t=>{const V=[90,200];angleFig(V,0,90);raMark(V,add(V,[1,0]),add(V,[0,-1]),C.gold,16);caption('right angle = 90°, a square corner');}},
  {title:'Acute angles',text:'An <b>acute</b> angle is <b>smaller</b> than a right angle. Hold a square corner against it: the arms are inside.',draw:t=>{angleFig([90,200],0,45,{check:Math.floor(t/1000)%2});caption('acute: smaller than a right angle');}},
  {title:'Obtuse angles',text:'An <b>obtuse</b> angle is <b>bigger</b> than a right angle, but less than a straight line.',draw:t=>{angleFig([150,200],0,130,{check:Math.floor(t/1000)%2});caption('obtuse: bigger than a right angle');}}],
 symmetry:[{title:'Line of symmetry',text:'A <b>line of symmetry</b> splits a shape into two halves that are <b>mirror images</b>.',draw:t=>{const S=SYM[4],O=[160,135];poly(S[1].map(p=>add(O,p)),'rgba(91,155,255,.30)',C.fg,3);axisLine(O,90,C.gold,true,120);caption('both halves match');}},
  {title:'The fold test',text:'Fold along the line. If the halves match exactly, it is a line of symmetry. If not, it is not.',draw:t=>{const S=SYM[1],O=[160,135],th=Math.floor(t/1400)%2?90:35;poly(S[1].map(p=>add(O,p)),'rgba(91,155,255,.30)',C.fg,3);poly(S[1].map(p=>add(O,reflP(p,th))),th===90?'rgba(61,214,140,.35)':'rgba(255,138,61,.30)',th===90?C.ok:C.warn,2.5,th!==90);axisLine(O,th,C.gold,true,125);caption(th===90?'match: a line of symmetry':'no match: not a line of symmetry',th===90?C.ok:C.warn);}},
  {title:'More than one line',text:'Some shapes have <b>several</b> lines of symmetry. A square has <b>4</b>. Some shapes have <b>none</b>.',draw:t=>{const S=SYM[0],O=[160,135],k=countUp(t,4,700);poly(S[1].map(p=>add(O,p)),'rgba(91,155,255,.30)',C.fg,3);S[2].slice(0,k).forEach(a=>axisLine(O,a,C.gold,true,100));caption('a square has 4 lines of symmetry');}}]
};
Object.assign(GAMES,SQ2_GAMES);Object.assign(TEACH,SQ2_TEACH);

/*</SQ2>*/
function menu(){
  st.mode='menu'; st.locked=false; st.q=null; cv.classList.remove('tap');
  setHud('Choose a game',Object.keys(GAMES).length+' games');
  setPrompt('<span class="big">Choose a game</span><span>Each game starts with a short lesson. Lines are colour coded: '+TYPEWORD.H+' '+TYPEWORD.V+' '+TYPEWORD.D+'</span>');
  const b=k=>best[k]!=null?`<small>Best ${best[k]}${k==='pin'?' / '+PIN_LEVELS.length+' levels':' / 8'}</small>`:`<small>${GAMES[k].sub}</small>`;
  setButtons(Object.keys(GAMES).map(k=>({label:GAMES[k].name+b(k),value:k})),v=>startTeach(v),2);
}
function menuScene(t){
  drawPoly3(SOLIDS['cube'].poly,t*0.0006,160,124,null,44);
  const pts=[[56,56],[264,56],[56,214],[264,214]];
  poly(fit([[0,0],[4,0],[4,2.4],[0,2.4]],0,{cx:56,cy:56,w:56,h:40}),'rgba(91,155,255,.35)',C.v,2.5);
  poly(fit(reg(6,1),t*0.0003*57,{cx:264,cy:56,w:50,h:50}),'rgba(61,214,140,.3)',C.d,2.5);
  poly(fit([[0,0],[0,3],[4,3]],0,{cx:56,cy:214,w:56,h:44}),'rgba(255,107,129,.3)',C.h,2.5);
  for(let i=0;i<3;i++)for(let j=0;j<3;j++)dot([244+i*20,194+j*20],3.5,C.pin);
  ctx.strokeStyle=C.gold;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(244,194);ctx.lineTo(284,194);ctx.lineTo(264,234);ctx.closePath();ctx.stroke();
  text('Lines · 2D · 3D · Nets',160,262,14,C.muted,500);
}

/* ---------- quiz engine ---------- */
function startQuiz(kind){ st.kind=kind; st.round=0; st.score=0; st.hearts=3; cv.classList.remove('tap'); nextQ(); }
function quizHud(){ setHud(pips(st.hearts), `Question ${st.round} / 8 · Score ${st.score}`); }
function nextQ(){
  if(st.round>=8||st.hearts<=0) return endQuiz();
  st.round++; st.mode='quiz'; st.q=GAMES[st.kind].make(); st.locked=false;
  quizHud(); setPrompt(st.q.prompt); setButtons(st.q.options,answer,st.q.cols||2);
}
async function answer(v){
  if(st.locked) return; st.locked=true; const q=st.q, ok=v===q.answer;
  st.btns.forEach(b=>{ if(b.dataset.v===String(v)) b.classList.add('sel'); });
  setPrompt(q.prompt+'<span class="note">Watch…</span>');
  await q.reveal();
  if(ok){ st.score++; sGood(); setPrompt(`<span class="big good">Correct</span><span>${q.explain}</span>`); }
  else { st.hearts--; sBad(); shake(); setPrompt(`<span class="big bad">Not quite</span><span>The answer is <b>${q.say(q.answer)}</b>. ${q.explain}</span>`); }
  quizHud();
  setButtons([{label:st.round>=8||st.hearts<=0?'See my score':'Next question',value:'n',cls:'run wide'}],()=>nextQ(),1);
}
function endQuiz(){
  st.mode='over'; st.q=null;
  st.stars=st.score>=7?3:st.score>=5?2:st.score>=3?1:0;
  st.overTitle=st.hearts>0?'Round complete':'Out of lives';
  st.overScore=st.score+' / 8'; saveBest(st.kind,st.score); st.overBest='Best score: '+best[st.kind]+' / 8';
  if(st.hearts>0) sWin(); else sBad();
  setHud(GAMES[st.kind].name, st.stars+' / 3 stars');
  setPrompt(st.stars===3?'<span class="big good">Brilliant shape work</span><span>Try a different game next.</span>':'<span class="big">Keep practising</span><span>Play again to earn more stars. The answers always show you how to check.</span>');
  setButtons([{label:'Play again',value:'a',cls:'run'},{label:'Learn again',value:'l'},{label:'Menu',value:'m'}],v=>v==='a'?startQuiz(st.kind):v==='l'?startTeach(st.kind):menu(),3);
}
function star(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(x+rr*Math.cos(a),y+rr*Math.sin(a));}ctx.closePath();ctx.fill();}
function overScene(){
  text(st.overTitle,160,50,22,C.fg,600); text('SCORE',160,96,12,C.muted,500); text(st.overScore,160,130,40,C.fg,600);
  for(let i=0;i<3;i++) star(110+i*50,196,18,i<st.stars?C.gold:C.off);
  text(st.overBest,160,254,13,C.muted,500);
}

/* ---------- render loop ---------- */
function render(t){
  const dt=Math.min(50,t-(st.lastT||t)); st.lastT=t;
  bg();
  try{
    if(st.mode==='menu') menuScene(t);
    else if(st.mode==='quiz'&&st.q) st.q.draw(t,dt);
    else if(st.mode==='pin') pinScene();
    else if(st.mode==='over') overScene();
    else if(st.mode==='teach') teachScene(t);
  }catch(e){ console.error(e); }
  requestAnimationFrame(render);
}

/* ---------- top bar and keyboard ---------- */
$('btnMenu').addEventListener('click',()=>{ if(!st.locked||st.mode==='over'){ sClick(); menu(); } });
$('btnSound').addEventListener('click',()=>{ muted=!muted; $('btnSound').textContent=muted?'Sound: off':'Sound: on'; if(!muted) sClick(); });
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowLeft'){move(-1,0);e.preventDefault();}
  else if(k==='ArrowRight'){move(1,0);e.preventDefault();}
  else if(k==='ArrowUp'){move(0,-1);e.preventDefault();}
  else if(k==='ArrowDown'){move(0,1);e.preventDefault();}
  else if(k==='Escape'){ if(!st.locked||st.mode==='over') menu(); }
});
window.__SQ={st,GAMES,HEX_POOL,foldCube,props,PIN_LEVELS,simplify};
(function(){ const h=location.hash.slice(1); if(TEACH[h]) startTeach(h); else menu(); })();
requestAnimationFrame(render);
})();
</script>
